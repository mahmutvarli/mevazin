.copt{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;text-align:left;min-height:48px;padding:.55em .8em;border:1px solid var(--border-control);border-radius:var(--r-s);background:var(--surface);color:var(--ink);cursor:pointer;font-size:var(--fs-small);line-height:1.3;transition:border-color .2s var(--e-std),background-color .2s var(--e-std)}

.copt[aria-pressed="true"]{border-color:var(--tc);background:var(--sc);box-shadow:inset 3px 0 0 var(--tc)}
.copt[aria-pressed="true"] span{color:var(--ink)}
.crng{display:flex;flex-direction:column;gap:.2em;border-top:var(--hair) solid var(--line);padding-top:.6em}

.crng .vrow{display:flex;gap:.5em;align-items:center}
.crng input[type=range]{flex:1;min-width:0;accent-color:var(--tc);height:44px}
.crng .btn{padding:0;width:44px;height:44px;flex:none}
.crng .hint{font-size:var(--fs-small);color:var(--ink-muted);margin:0}
.cnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:var(--hair) solid var(--line);padding-top:var(--sp)}
.ctool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cpanel{border:var(--hair) solid var(--line);border-radius:var(--r-s);padding:calc(var(--sp)*.8) var(--sp);display:flex;flex-direction:column;gap:.6em;min-width:0}
.cpanel>h3{margin:0;font-family:var(--font-k);font-weight:600;font-size:var(--fs-kick);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}

.cdiag svg{display:block;width:100%;height:auto;overflow:visible}
.cdiag .nd rect{fill:var(--surface);stroke:var(--ink);stroke-width:1}

.cdiag .nd text.t{font-family:var(--font-n);font-size:17px}

.cdiag .nd.ghostn text{fill:var(--ink-muted)}
.cdiag .fl line,.cdiag .fl path{fill:none;stroke:var(--ink);stroke-width:1.25;vector-effect:non-scaling-stroke}
.cdiag .fl.dash line{stroke-dasharray:5 4}

.cdiag .fl.money .ah{fill:var(--tc)}
.cdiag .fl.go line.draw{animation:drawIn .8s var(--e-std) both;animation-delay:calc(var(--i,0)*110ms)}
.cdiag .fl.go .ah,.cdiag .fl.go text{animation:fadeOnly .4s var(--e-std) both;animation-delay:calc(var(--i,0)*110ms + 520ms)}
.cdiag .asset rect{fill:var(--sc);stroke:var(--tc);stroke-width:1}
.cdiag .asset text{fill:var(--ink);font-size:12.5px;font-family:var(--font)}
.cdiag .asset text.k{font-family:var(--font-k);font-size:10px;letter-spacing:.14em;fill:var(--ink-muted)}
.cdv{display:flex;flex-direction:column;gap:6px}
.cdv .vn{border:1px solid var(--ink);border-top:3px solid var(--tc);border-radius:var(--r-s);padding:.5em .8em;display:flex;flex-direction:column}
.cdv .vn.ghostn{border:1px dashed var(--border-control);color:var(--ink-muted)}
.cdv .vn b{font-family:var(--font-n);font-weight:500;font-size:1.05rem}
.cdv .vn span{font-size:.82rem;color:var(--ink-muted)}
.cdv .vf{display:flex;flex-direction:column;gap:2px;padding:2px 0 2px 18px;border-left:1px solid var(--line);margin-left:18px}
.cdv .vf div{display:flex;gap:.5em;align-items:center;font-size:.85rem}
.cdv .vf i{font-style:normal;font-family:var(--font-k);font-weight:700;width:1.2em;text-align:center;color:var(--ink-muted)}
.cdv .vf .money i{color:var(--tc)}
.cdv .vf .go{animation:fadeOnly .5s var(--e-std) both;animation-delay:calc(var(--i,0)*80ms)}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.chk li .st{display:block;font-family:var(--font-k);font-weight:600;font-size:var(--fs-kick);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.15em}

.chk li .fix{display:block;font-weight:600;margin-top:.2em}
.chk li.bad{border-left-color:var(--negative)}.chk li.bad .st{color:var(--negative)}
.chk li.dis{border-left-color:var(--warning)}.chk li.dis .st{color:var(--warning)}
.chk li.ok{border-left-color:var(--positive)}.chk li.ok .st{color:var(--positive)}
.chk li.sim{border-left-color:var(--ink-muted)}.chk li.sim .st{color:var(--ink-muted)}
.chk li.nw{animation:rise .45s var(--e-std) both}
.csum{display:flex;gap:1.2em;flex-wrap:wrap;font-size:var(--fs-small)}
.csum b{font-family:var(--font-n);font-weight:500;font-size:1.35em;margin-right:.25em}
.csum .bad b{color:var(--negative)}.csum .dis b{color:var(--warning)}.csum .ok b{color:var(--positive)}
.cbars{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:var(--hair) solid var(--ink);padding-top:6px}

.cflw{max-height:calc(var(--u,1px)*420);overflow:auto}

.cflw .cflt{min-width:0}
.ckv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em 1em;margin:0}
#app.mode-panel .ckv{grid-template-columns:repeat(2,minmax(0,1fr))}
.ckv div{border-top:var(--hair) solid var(--line);padding-top:.35em;min-width:0}
.ckv dt{font-family:var(--font-k);font-weight:600;font-size:var(--fs-kick);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.ckv dd{margin:0;font-family:var(--font-n);font-size:calc(var(--fs-lead)*.9);font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.cyour{border:var(--hair) solid var(--ink);border-top:calc(var(--u,1px)*6) solid var(--tc);border-radius:var(--r-s);padding:var(--sp) calc(var(--sp)*1.1);display:flex;flex-direction:column;gap:.6em}

#app.rm .cdiag .fl.go .ah,#app.rm .cdiag .fl.go text,#app.rm .cdv .vf .go{animation:fadeOnly .27s linear both!important;animation-delay:0s!important}
#app.rm .chk li.nw{animation:fadeOnly .27s linear both!important}

@media (max-width:760px){

.chap ol{grid-template-columns:repeat(7,minmax(0,1fr))}

/* place markers at their destinations or run the trips */
let scId = 0;
function scRun(svg, play) {
  const mks = Array.prototype.slice.call(svg.querySelectorAll('g.mkr'));
  if (!mks.length) return;
  const items = [], rm = RM();
  mks.forEach(m => {
    const p = svg.querySelector('[id="' + m.dataset.p + '"]'); if (!p) return;
    let L = 0; try { L = p.getTotalLength(); } catch (e) { L = 0; }
    const i = +m.dataset.i, w = +m.dataset.w;
    items.push({m, p, L, end: Math.max(0, L - i * 13), d: w * SC_WAVE + i * SC_STAG, h: m.dataset.h || ''});
  });
  const put = (it, f) => { let pt; try { pt = it.p.getPointAtLength(it.end * f); } catch (e) { pt = {x: 0, y: 0}; } it.m.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ')'); };
  const fin = it => { put(it, 1); it.m.style.opacity = it.h === 'b' || (it.h === 's' && !rm) ? '0' : '1'; };
  if (!play) { items.forEach(it => { it.m.classList.add('st'); fin(it); }); return; }
  if (rm) { items.forEach(it => { put(it, 1); if (it.h === 'b') { it.m.style.opacity = '0'; return; } it.m.style.opacity = '1'; it.m.classList.add('fadein'); it.m.style.animationDelay = Math.round(it.d * 0.3) + 'ms'; }); return; }
  const id = 'sc' + (++scId), t0 = performance.now();
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const done = () => { items.forEach(it => { it.m.classList.add('st'); fin(it); }); TW.delete(id); };
  TW.set(id, done);
  items.forEach(it => { put(it, 0); it.m.style.opacity = '0'; });
  const loop = now => {
    if (!TW.has(id)) return;
    let all = true;
    items.forEach(it => {
      const x = (now - t0 - it.d) / SC_DUR;
      if (x <= 0) { all = false; return; }
      if (x >= 1) { if (!it.ar) { it.ar = 1; fin(it); } return; }
      all = false; put(it, ease(x)); it.m.style.opacity = String(Math.min(1, x * 6));
    });
    if (all) { done(); return; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function scAll(scope, play) { if (!scope) return; scope.querySelectorAll('svg.scn').forEach(s => scRun(s, play && s.hasAttribute('data-play'))); }

function scReplay(btn) {
  const key = btn.dataset.k, fig = btn.closest('.scw'); if (!fig) return;
  if (!S.sr) S.sr = {};
  const sid = btn.dataset.sid, kk = +key.split(':').pop(), sc = SCN_BY[sid]; if (!sc) return;
  const rp = sc.steps[kk - 1].rep, max = rp.max || 12, n = Math.min(max, (S.sr[key] || 1) + 1);
  S.sr[key] = n; save();
  const box = fig.querySelector('.scbox'); AM = null; box.innerHTML = sceneSVG(sc, sid, kk, true); scAll(box, true);
  const c = fig.querySelector('.scc'); if (c) c.innerHTML = rp.c.split('{n}').join('<b>' + n + '</b>');
  if (n >= max) { btn.disabled = true; }
  announce(rp.c.split('{n}').join(String(n)) + '. ' + sceneAlt(sc, kk));
}

function cu(txt, b, key) {
  const m = String(txt).match(NUMRE);
  if (!m) return esc(txt);
  const num = m[2].replace(/\./g, '').replace(',', '.').replace('−', '-'); const dp = (m[2].split(',')[1] || '').length;
  return '<span class="cuw"><span class="sr">' + esc(txt) + '</span><span class="cu" aria-hidden="true" data-to="' + num + '" data-dp="' + dp + '" data-pre="' + esc(m[1]) + '" data-suf="' + esc(m[3]) + '" data-fin="' + esc(txt) + '"' + (b != null ? ' data-b="' + b + '"' : '') + (key ? ' data-k="' + key + '"' : '') + '>' + esc(txt) + '</span></span>';

function tweenNum(el, from) {
  const to = Number(el.dataset.to), dp = +el.dataset.dp || 0, pre = el.dataset.pre || '', suf = el.dataset.suf || '', fin = el.dataset.fin;
  if (from === to) { el.textContent = fin; return; }
  const nf = new Intl.NumberFormat('tr-TR', {minimumFractionDigits: dp, maximumFractionDigits: dp, useGrouping: Math.abs(to) >= 10000 || /\d\.\d{3}/.test(fin)});
  const dur = RM() ? 280 : Math.min(1100, 650 + String(Math.round(Math.abs(to))).length * 40), t0 = performance.now(), id = ++twId;
  const neg = to < 0 || /^[−-]/.test(pre);

  TW.set(id, done);
  const step = now => {
    if (!TW.has(id)) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    if (p >= 1) { done(); return; }
    const v = from + (to - from) * e;
    el.textContent = pre + (neg && to < 0 ? '−' : '') + nf.format(Math.abs(v)) + suf;
  };

}

    if (mode === 'screen' || (mode === 'build' && String(el.dataset.b) === String(k))) tweenNum(el, 0);

/* ---------------- deck visuals ---------------- */
function visual(t, d, k) {
  const v = t.visual;
  if (v.kind === 'cards') return '<div class="tiles">' + v.items.map((it, i) => '<div class="tile' + (i === k - 1 ? ' now' : '') + rvc(i + 1, k) + '" style="--i:' + i + '"><span class="tn">' + pad2(i + 1) + '</span><b>' + esc(it.h) + '</b><span class="tt">' + esc((d.short || [])[i] || it.t) + '</span></div>').join('') + '</div>';
  if (v.kind === 'parties') {
    const idx = {}; v.nodes.forEach((n, i) => { idx[n.id] = i; });
    let h = '<div class="pmap">';
    v.nodes.forEach((n, i) => {
      h += '<div class="pn ' + (n.c || '') + (AM === 'screen' ? ' pop' : '') + '" style="--i:' + i + '"><b>' + esc(n.b) + '</b><span>' + esc(n.s || '') + '</span></div>';
      if (i < v.nodes.length - 1) {
        const ls = v.links.filter(l => Math.min(idx[l.from], idx[l.to]) === i);
        h += '<div class="pls">' + ls.map(l => {
          const li = v.links.indexOf(l), fw = idx[l.from] < idx[l.to], si = v.links.filter(x => x.b === l.b).indexOf(l);
          return '<div class="pl' + rvc(l.b, k) + (l.b === k ? ' on' : '') + '" style="--i:' + si + '">' + arrowH(fw, drw(l.b, k), si) + '<span>' + esc((d.short || [])[li] || l.t) + '<span class="sr"> (' + esc(v.nodes[idx[l.from]].b) + ' → ' + esc(v.nodes[idx[l.to]].b) + ')</span></span></div>';
        }).join('') + '</div>';
      }
    });
    return h + '</div>';
  }
  if (v.kind === 'bars') {
    const mx = Math.max.apply(null, v.items.map(i => i.v));
    let h = '<div class="barsw"><p class="formula' + (AM === 'screen' ? ' rv' : '') + '" style="--i:2">' + esc(t.prose) + '</p><div class="bars" role="list" data-fig="1">';
    h += v.items.map((it, i) => { const nw = isNewB(it.b, k); return '<div role="listitem" class="barc' + (it.b > k ? ' wait' : '') + (it.v === mx ? ' hi' : '') + '"><span class="bar-v">' + cu(it.t, it.b) + '</span><div class="bv' + (nw ? ' bar-grow' : '') + '" style="--i:' + (i % 3) + ';height:' + (100 * it.v / mx * 0.82).toFixed(1) + '%"></div><span class="sr">' + esc(it.l) + ', ' + esc(it.s) + '</span></div>'; }).join('');
    h += '</div><div class="barlab" aria-hidden="true" data-fig="1">' + v.items.map(it => '<span' + (it.b > k ? ' class="wait"' : '') + '><b>' + esc(it.l) + '</b>' + esc(it.s) + '</span>').join('') + '</div>';
    if (v.foot) h += '<p class="bartot' + rvc(v.foot.b, k) + '">' + esc(d.foot || v.foot.t) + '</p>';
    return h + '</div>';
  }
  if (v.kind === 'timeline') {
    let h = '<div class="tline" role="list" data-fig="1">' + v.periods.map((p, i) => { const lost = p.lost && k >= p.lost; return '<div role="listitem" class="tp' + (p.ev ? ' ev' : '') + (lost ? ' lost' + ((AM === 'screen') || (AM === 'build' && p.lost === k) ? ' nw' : '') : '') + (AM === 'screen' ? ' pop' : (AM === 'build' && p.lost === k ? ' pop' : '')) + '" style="--i:' + i + '"><b>' + esc(p.l) + '</b>' + esc(lost ? p.s : (p.lost ? 'planlı' : p.s)) + '</div>'; }).join('') + '</div>';
    h += '<div class="stmts">' + v.items.map((it, i) => '<div class="stmt' + rvc(i + 1, k) + '" style="--i:' + (i + 3) + '"><b>' + esc(it.h) + '</b><span>' + esc((d.short || [])[i] || it.t) + '</span></div>').join('') + '</div>';
    return h;
  }
  if (v.kind === 'flow') {
    let h = '<div class="flow">';
    v.items.forEach((it, i) => {
      const sh = (d.short || [])[i] || [it.h, it.t];
      if (i) h += '<div class="far' + (i + 1 > k ? ' wait' : '') + '" aria-hidden="true"><svg class="draw-s" viewBox="0 0 90 30"><path class="draw' + drw(i + 1, k) + '" pathLength="1" d="M2 15H80"/><path class="draw' + drw(i + 1, k) + '" pathLength="1" d="M70 5L84 15L70 25"/></svg></div>';
      h += '<div class="fs' + (i === k - 1 ? ' now' : '') + rvc(i + 1, k) + '" style="--i:' + (i ? 3 : 0) + '"><span class="tn">' + pad2(i + 1) + '</span><h4>' + esc(sh[0]) + '</h4><span>' + esc(sh[1]) + '</span></div>';
    });
    return h + '</div>';
  }
  return '';
}

function guideStep(ai) {

  else if (g.att >= 2) { g.pts = 0; g.exp = true; g.log.push({t: 'explanation', at: new Date().toISOString()}); announce('Onaylı yanıt ve açıklama gösterildi.'); }
  else announce(cat === 'unknown' ? 'Bilmiyorum kaydedildi. İpucu, yeniden deneme veya açıklama seçebilirsin.' : 'Bu yanıt onaylı anahtarla uyuşmuyor. İpucu, yeniden deneme veya açıklama seçebilirsin.');

}

function go(p, how) {
  p = Math.max(0, Math.min(POS.length - 1, p));
  const pp = POS[p];
  navDir = p < S.pos || how === 'back' ? -1 : 1;
  if (how === 'back' && hasB(pp)) S.shown[p] = nB(pp);
  else if (hasB(pp)) S.shown[p] = 1;
  if (pp.k === 'check' && (S.chk.st === 'notStarted' || S.chk.st === 'skipped')) { S.chk.st = 'inProgress'; logE('check', {st: 'inProgress', via: how || 'go'}); }
  const from = S.pos;
  S.pos = p; S.frontier = Math.max(S.frontier, p);
  if (hasB(pp)) markSeen(p);
  logE('nav', {pos: p, from: from, how: how || 'go'});
  anim = 'screen'; render();
  updCat(navDir, how);
  if (pp.k === 'teach') { const t = AS[pp.a].teaching[pp.t]; announce('Slayt ' + (pp.t + 1) + '/' + AS[pp.a].teaching.length + ': ' + t.title + (nBuilds(t) > 1 ? ', adım ' + shownOf(p) + '/' + nBuilds(t) : '')); }
  else if (pp.k === 'open') { const o = OPEN[pp.o]; announce('Bildiğin yerden başla ' + (pp.o + 1) + '/' + OPEN.length + ': ' + o.kick + ', adım ' + shownOf(p) + '/' + nB(pp) + '. ' + o.steps[shownOf(p) - 1]); }
  else if (how === 'map') announce(progText());
}
function markSeen(p) { const pp = POS[p]; const id = pp.k === 'open' ? OPEN[pp.o].id : AS[pp.a].teaching[pp.t].id; if (shownOf(p) >= nB(pp)) S.seen[id] = true; }
function next() {
  const p = curP();
  if (hasB(p)) {
    const n = nB(p), k = shownOf(S.pos);
    if (k < n) { S.shown[S.pos] = k + 1; markSeen(S.pos); anim = 'build'; render(); announce('adım ' + (k + 1) + '/' + n + (p.k === 'open' ? ': ' + OPEN[p.o].steps[k] : '')); return; }
    return go(S.pos + 1);
  }
  if (p.k === 'ws') { const w = wsS(p.a); if (w.status === 'untouched' || w.status === 'inProgress') { w.status = 'skipped'; w.wasSkipped = true; logE('workshop', {a: AS[p.a].id, status: 'skipped'}); } return go(S.pos + 1); }
  if (p.k === 'game') {
    const it = AS[p.a].game.items[p.i], g = gS(it);
    if (!g.att) { gRespond(it, 'unknown'); anim = 'state'; return render(); }
    if (!g.exp) { gShowExp(it); anim = 'state'; announce('Onaylı yanıt ve açıklama gösterildi.'); return render(); }
    if (!g.done) { g.done = true; g.log.push({t: 'ack', at: new Date().toISOString()}); }
    return go(S.pos + 1);
  }
  if (p.k === 'station') { const a = AS[p.a]; if (gameSummary(p.a).pts < 20 && !S.choices[a.id]) { S.choices[a.id] = 'devam'; logE('station', {a: a.id, choice: 'devam'}); } return go(S.pos + 1); }
  if (p.k === 'checkIntro') { if (S.chk.st === 'notStarted' || S.chk.st === 'skipped') { S.chk.st = 'skipped'; logE('check', {st: 'skipped'}); return go(P_RESULTS); } if (S.chk.st === 'submitted') return go(P_RESULTS); return go(S.pos + 1); }
  if (p.k === 'check') { const it = FORM[p.j]; if (!S.chk.ans[it.id] && S.chk.st !== 'submitted') S.chk.ans[it.id] = {unknown: true}; return go(S.pos + 1); }
  if (p.k === 'checkReview') { if (S.chk.st !== 'submitted') submitCheck(); return go(P_RESULTS); }
  if (p.k === 'cap') { const c = capS(); if (c.st === 'untouched') { c.st = 'skipped'; logE('capstone', {st: 'skipped'}); } return go(S.pos + 1); }
  if (p.k === 'recap') { if (S.wrap !== 'completed') { S.wrap = 'skipped'; logE('wrap', {st: 'skipped'}); } return go(S.pos + 1); }
  if (p.k === 'end') { if (!S.done) { S.done = true; logE('finish'); render(); announce('Ders bitti olarak kaydedildi.'); catReact('cheer'); } return; }
  go(S.pos + 1);
}

}
