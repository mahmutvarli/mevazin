<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kira Sertifikası Dersi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kira sertifikası (ijara sukuk) pilot dersi: beş bölüm, atölyeler, oyunlar ve 9:16 özet. SINIRLI · pilot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..800&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans:ital,wght@0,400..700;1,400..600&family=Noto+Serif+Display:ital,wght@0,300..700;1,300..600&display=swap">
<style>
/* ======================= tokens ======================= */
:root{
  --bg:#F7F3EA;--surface:#FFFFFF;--surface-2:#EFE8D9;--surface-accent:#D9EDEA;
  --ink:#15171B;--ink-muted:#545A62;--line:#DDD4C2;--border-control:#7C7466;
  --accent:#0D6B66;--on-accent:#FFFFFF;--focus:#1D5EAE;
  --positive:#1F7A45;--negative:#B53A22;--warning:#8A5400;
  --pos-soft:#DDF0E3;--neg-soft:#F8E1DB;--warn-soft:#F7EBD2;
  --btn:#15171B;--on-btn:#F7F3EA;
  --f0:#15171B;--on-f0:#F7F3EA;--t0:#15171B;--s0:#EFE8D9;
  --f1:#0D6B66;--on-f1:#FFFFFF;--t1:#0D6B66;--s1:#D9EDEA;
  --f2:#F0642F;--on-f2:#1A0F08;--t2:#A93A10;--s2:#FCE3D8;
  --f3:#F4C430;--on-f3:#1A1505;--t3:#7F5C00;--s3:#FBF0C9;
  --f4:#3B3FC0;--on-f4:#FFFFFF;--t4:#3B3FC0;--s4:#E2E3F7;
  --f5:#C7255F;--on-f5:#FFFFFF;--t5:#AE1F52;--s5:#F7DCE6;
  --role-1:var(--t1);--role-2:var(--t2);--role-3:var(--t4);--role-4:var(--ink-muted);
  --shadow:rgba(40,30,10,.18);--scrim:rgba(21,23,27,.55);--story-backdrop:#15171B;
  --e-out:cubic-bezier(.16,1,.3,1);--e-std:cubic-bezier(.2,0,0,1);--e-in:cubic-bezier(.5,0,.75,0);--e-spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Noto Serif Display","Noto Serif",Georgia,"Times New Roman",serif;
  --font-k:"Archivo","Noto Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-ar:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101214;--surface:#1A1D21;--surface-2:#24282D;--surface-accent:#0F2B29;
    --ink:#F1EEE8;--ink-muted:#A9B0B8;--line:#33383E;--border-control:#7A828A;
    --accent:#5CD6CB;--on-accent:#04201E;--focus:#8EBAFA;
    --positive:#6CC48F;--negative:#EE8A78;--warning:#F0C374;
    --pos-soft:#14301F;--neg-soft:#3A1A14;--warn-soft:#33260C;
    --btn:#F1EEE8;--on-btn:#101214;
    --f0:#2A2F36;--on-f0:#F1EEE8;--t0:#F1EEE8;--s0:#24282D;
    --f1:#2BB3A8;--on-f1:#04201E;--t1:#5CD6CB;--s1:#0F2B29;
    --f2:#FF7A45;--on-f2:#1A0B04;--t2:#FF9A6E;--s2:#33190E;
    --f3:#FFD24A;--on-f3:#1A1505;--t3:#FFD24A;--s3:#322A0C;
    --f4:#8C90FF;--on-f4:#0B0C2A;--t4:#A9ACFF;--s4:#1B1C3F;
    --f5:#FF5C93;--on-f5:#22040F;--t5:#FF85AE;--s5:#36101F;
    --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.66);--story-backdrop:#08090A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101214;--surface:#1A1D21;--surface-2:#24282D;--surface-accent:#0F2B29;
  --ink:#F1EEE8;--ink-muted:#A9B0B8;--line:#33383E;--border-control:#7A828A;
  --accent:#5CD6CB;--on-accent:#04201E;--focus:#8EBAFA;
  --positive:#6CC48F;--negative:#EE8A78;--warning:#F0C374;
  --pos-soft:#14301F;--neg-soft:#3A1A14;--warn-soft:#33260C;
  --btn:#F1EEE8;--on-btn:#101214;
  --f0:#2A2F36;--on-f0:#F1EEE8;--t0:#F1EEE8;--s0:#24282D;
  --f1:#2BB3A8;--on-f1:#04201E;--t1:#5CD6CB;--s1:#0F2B29;
  --f2:#FF7A45;--on-f2:#1A0B04;--t2:#FF9A6E;--s2:#33190E;
  --f3:#FFD24A;--on-f3:#1A1505;--t3:#FFD24A;--s3:#322A0C;
  --f4:#8C90FF;--on-f4:#0B0C2A;--t4:#A9ACFF;--s4:#1B1C3F;
  --f5:#FF5C93;--on-f5:#22040F;--t5:#FF85AE;--s5:#36101F;
  --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.66);--story-backdrop:#08090A;
  color-scheme:dark;
}
/* section colour fields */
.sec-0{--fc:var(--f0);--on-fc:var(--on-f0);--tc:var(--t0);--sc:var(--s0)}
.sec-1{--fc:var(--f1);--on-fc:var(--on-f1);--tc:var(--t1);--sc:var(--s1)}
.sec-2{--fc:var(--f2);--on-fc:var(--on-f2);--tc:var(--t2);--sc:var(--s2)}
.sec-3{--fc:var(--f3);--on-fc:var(--on-f3);--tc:var(--t3);--sc:var(--s3)}
.sec-4{--fc:var(--f4);--on-fc:var(--on-f4);--tc:var(--t4);--sc:var(--s4)}
.sec-5{--fc:var(--f5);--on-fc:var(--on-f5);--tc:var(--t5);--sc:var(--s5)}

/* ======================= base ======================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5;overflow-x:hidden;transition:background-color .3s var(--e-std),color .3s var(--e-std)}
.num,.hero,.gvn,.cuw,table,.tin input,.vctl output,.kv dd,.restab,.bar-v{font-variant-numeric:tabular-nums lining-nums}
h2[tabindex="-1"]:focus,h3[tabindex="-1"]:focus,.fb[tabindex="-1"]:focus,p[tabindex="-1"]:focus{outline:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:60;background:var(--surface);color:var(--ink);padding:8px 12px;border:2px solid var(--focus);border-radius:8px}
.skip:focus{top:8px}
[lang="ar"]{font-family:var(--font-ar)}

/* ======================= chrome ======================= */
#app{min-height:100vh;display:flex;flex-direction:column;--cur-f:var(--f1)}
.top{position:relative;display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--bg);min-height:60px;border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex:0 1 auto}
.brand b{font-family:var(--font-d);font-weight:800;font-size:21px;letter-spacing:-.015em;white-space:nowrap}
.brand small{font-family:var(--font-k);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.prog{flex:1 1 auto;min-width:0;text-align:center;font-family:var(--font-k);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar{position:absolute;left:0;right:0;bottom:-1px;height:4px;overflow:hidden}
.topbar i{display:block;height:100%;width:0;background:var(--cur-f);transition:width .7s var(--e-out),background-color .5s var(--e-std)}
.tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tset{display:flex;gap:8px}
.tbtn{min-height:44px;padding:6px 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;font-family:var(--font-k);font-weight:700;font-size:14px;letter-spacing:.02em;transition:background-color .2s var(--e-std),color .2s var(--e-std)}
.tbtn:hover{background:var(--ink);color:var(--bg)}
.tbtn[aria-pressed="true"],.tbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
#btnMap{background:var(--ink);color:var(--bg)}
#btnMap:hover{background:var(--cur-f);border-color:var(--cur-f);color:var(--ink)}
#btnMore{display:none}
.pilot{letter-spacing:.16em}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#player{flex:1;display:flex;flex-direction:column;min-height:0}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
.dock{background:var(--bg);border-top:1px solid var(--line)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 12px}
.controls .mid{flex:1;text-align:center;color:var(--ink-muted);font-family:var(--font-k);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:44px;min-width:44px;padding:8px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--font-k);font-weight:700;letter-spacing:.01em;transition:background-color .15s var(--e-std),color .15s var(--e-std),transform .15s var(--e-std),border-color .15s var(--e-std)}
.btn:hover:not([disabled]){box-shadow:0 3px 0 var(--ink)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:.88em}
#btnNext{min-width:170px;font-size:17px;padding:10px 26px}
#btnNext::after{content:"→";display:inline-block;margin-left:.4em;transition:transform .2s var(--e-out)}
#btnNext:hover::after{transform:translateX(4px)}
#btnBack::before{content:"←";margin-right:.4em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ======================= stage ======================= */
.stage{position:relative;background:var(--surface);border-radius:22px;overflow:hidden;color:var(--ink);box-shadow:0 22px 50px -30px var(--shadow),0 0 0 1px var(--line);isolation:isolate}
#app.mode-stage .stage,#app.mode-stage .scr{
  --fs-mega:calc(var(--u)*300);--fs-hero:calc(var(--u)*230);--fs-head:calc(var(--u)*128);--fs-head-s:calc(var(--u)*100);--fs-head-xs:calc(var(--u)*74);
  --fs-lead:calc(var(--u)*46);--fs-body:calc(var(--u)*36);--fs-label:calc(var(--u)*32);--fs-small:calc(var(--u)*26);--fs-kick:calc(var(--u)*23);
  --sp:calc(var(--u)*28);--pad-x:calc(var(--u)*112);--pad-y:calc(var(--u)*80);--r:calc(var(--u)*22);--gap:calc(var(--u)*30);--dist:64px}
#app.mode-panel #stageWrap{display:block;padding:12px 16px 12px}
#app.mode-panel .stage{
  --fs-mega:clamp(4.5rem,26cqi,9rem);--fs-hero:clamp(3.6rem,19cqi,6.5rem);--fs-head:clamp(2.4rem,11.2cqi,3.9rem);--fs-head-s:clamp(2.1rem,9.6cqi,3.3rem);--fs-head-xs:clamp(1.55rem,6.6cqi,2.3rem);
  --fs-lead:1.3rem;--fs-body:1.0625rem;--fs-label:1.02rem;--fs-small:.9rem;--fs-kick:.74rem;
  --sp:16px;--pad-x:20px;--pad-y:24px;--r:16px;--gap:14px;--dist:40px;
  width:100%;max-width:900px;margin:0 auto;height:auto!important;container-type:inline-size;--u:.55px}
#app.mode-panel .scr>*,#app.mode-panel .cover>*,#app.mode-panel .copy>*,#app.mode-panel .block>*{min-width:0;max-width:100%}
#app.mode-panel .chip{white-space:normal}
#app.mode-panel .scr>.mission{max-width:none}
#app.mode-panel .hl{max-width:100%}
#app.mode-panel .dock{position:sticky;bottom:0;z-index:15}
.scr{position:relative;z-index:1;height:100%;padding:var(--pad-y) var(--pad-x);font-size:var(--fs-body);line-height:1.45;display:flex;flex-direction:column;gap:var(--sp);background:var(--surface);min-width:0}
.scr.ghost{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app.mode-panel .scr.ghost{height:auto;bottom:auto}
#app.mode-stage .wait{visibility:hidden}
#app.mode-panel .wait{display:none}
#app.mode-stage .scr{overflow:hidden}
#app.mode-stage .scr.scroll{overflow:auto}

/* type */
.tk{display:flex;flex-wrap:wrap;gap:.5em 1em;align-items:center;font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.18em;text-transform:uppercase;color:var(--tc,var(--ink-muted));margin:0}
.tk .no{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.4em;padding:0 .5em;border-radius:999px;background:var(--fc);color:var(--on-fc);letter-spacing:.06em}
.tk .dim{color:var(--ink-muted)}
.on-field .tk,.on-field .tk .dim{color:var(--on-fc)}
.on-field .tk .no{background:var(--on-fc);color:var(--fc)}
.hl{font-family:var(--font-d);font-weight:800;font-size:var(--fs-head);line-height:.98;letter-spacing:-.025em;margin:0;max-width:16ch;text-wrap:balance;overflow-wrap:break-word}
.hl.s{font-size:var(--fs-head-s);max-width:20ch}
.hl.xs{font-size:var(--fs-head-xs);max-width:24ch;line-height:1.04}
.hl .ln{display:block;overflow:hidden;padding:.09em 0 .07em;margin:-.09em 0 -.07em}
.hl .ln>span{display:inline-block}
.lead{font-size:var(--fs-lead);line-height:1.25;margin:0;max-width:26ch;font-weight:500}
.quote{font-family:var(--font-d);font-style:italic;font-weight:600;font-size:var(--fs-lead);line-height:1.18;margin:0;max-width:24ch;padding-left:.6em;border-left:calc(var(--u,1px)*10) solid var(--fc);letter-spacing:-.01em}
#app.mode-panel .quote{border-left-width:6px}
.on-field .quote{border-color:var(--on-fc)}
.small{font-size:var(--fs-small)}
.muted{color:var(--ink-muted)}
.prose{margin:0;max-width:60ch}
.chip{display:inline-flex;align-items:center;gap:.3em;font-family:var(--font-k);font-weight:700;font-size:var(--fs-kick);letter-spacing:.08em;text-transform:uppercase;padding:.35em .8em;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.chip.sample{color:var(--t2)}
.on-field .chip.sample{color:var(--on-fc)}
.hero{font-family:var(--font-k);font-stretch:118%;font-weight:900;font-size:var(--fs-hero);line-height:.86;letter-spacing:-.045em;margin:0;white-space:nowrap}
.hero.l{font-size:calc(var(--fs-hero)*.56)}
.hero.xl{font-size:calc(var(--fs-hero)*.42)}
.hero .u{font-size:.24em;letter-spacing:-.01em;font-stretch:100%;font-weight:800;margin-left:.15em;vertical-align:.15em}
.heroc{font-family:var(--font-k);font-weight:700;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase;margin:0}
.term{display:flex;flex-wrap:wrap;gap:.25em .7em;align-items:baseline;font-size:var(--fs-label);margin:0}
.term b{font-family:var(--font-d);font-weight:700;font-style:italic;font-size:1.1em}
.term i{font-style:normal;color:var(--ink-muted)}
.term [lang="ar"]{font-size:1.15em}
.on-field .term i{color:var(--on-fc)}

/* route chips on a colour field */
.on-field .route span{border-color:var(--on-fc);color:var(--on-fc);opacity:.75}
.on-field .route span.on{opacity:1;background:transparent;box-shadow:inset 0 0 0 1px var(--on-fc)}
.on-field .route span.done{opacity:1;background:var(--on-fc);color:var(--fc);border-color:var(--on-fc)}
/* split layout: copy + colour block */
.scr.lay-split{padding:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:0}
.lay-split .copy{padding:var(--pad-y) calc(var(--pad-x)*.6) var(--pad-y) var(--pad-x);display:flex;flex-direction:column;gap:var(--sp);min-width:0}
.block{background:var(--fc);color:var(--on-fc);padding:var(--pad-y) var(--pad-x) var(--pad-y) calc(var(--pad-x)*.62);display:flex;flex-direction:column;justify-content:center;gap:var(--sp);min-width:0}
#app.mode-panel .scr.lay-split{display:flex;flex-direction:column}
#app.mode-panel .block{padding:24px 20px}
.lay-split .copy .hl{margin-top:auto}
.lay-split .copy .drw{margin-top:auto}
/* stack layout (model) */
.stack-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:var(--gap);align-items:end}
#app.mode-panel .stack-top{grid-template-columns:1fr}
.nowcap{display:flex;flex-direction:column;gap:.4em}
.nowcap .stepno{font-family:var(--font-k);font-weight:900;font-stretch:115%;font-size:calc(var(--fs-hero)*.42);line-height:.9;color:var(--tc);letter-spacing:-.03em}
.nowcap .stepno small{font-size:.4em;color:var(--ink-muted);letter-spacing:0}
.nowcap p{margin:0;font-size:var(--fs-lead);line-height:1.2;font-weight:600;max-width:22ch}
.vis{margin:0;flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}

/* tiles (cards visual / given values) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
#app.mode-panel .tiles{grid-template-columns:1fr}
.tile{position:relative;border-radius:var(--r);padding:calc(var(--sp)*1.1);background:var(--surface-2);display:flex;flex-direction:column;justify-content:flex-end;gap:.35em;min-height:calc(var(--sp)*10);transition:background-color .4s var(--e-std),color .4s var(--e-std)}
#app.mode-panel .tile{min-height:0}
.tile .tn{font-family:var(--font-k);font-weight:900;font-stretch:120%;font-size:calc(var(--fs-hero)*.42);margin-bottom:auto;line-height:.9;letter-spacing:-.03em;color:var(--tc)}
.tile b{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.14em;text-transform:uppercase}
.tile .tt{font-family:var(--font-d);font-weight:800;font-size:calc(var(--fs-lead)*1.3);line-height:1.08;letter-spacing:-.01em}
.tile.now{background:var(--fc);color:var(--on-fc)}
.tile.now .tn{color:var(--on-fc)}
.gv{display:grid;grid-template-columns:repeat(3,auto);gap:var(--gap);justify-content:start;margin:0;padding:0;list-style:none}
#app.mode-panel .gv{grid-template-columns:repeat(3,minmax(0,1fr))}
.gv li{display:flex;flex-direction:column;gap:.15em;border-top:calc(var(--u,1px)*6) solid var(--fc);padding-top:.5em;min-width:0}
#app.mode-panel .gv li{border-top-width:4px}
.gvn{font-family:var(--font-k);font-weight:900;font-stretch:112%;font-size:calc(var(--fs-hero)*.3);line-height:.95;letter-spacing:-.03em;white-space:nowrap}
.gvn.l{font-size:calc(var(--fs-hero)*.17)}
.gv li>span:not(.gvn){font-size:var(--fs-small);color:var(--ink-muted);line-height:1.2}
/* worked step box */
.stepbox{display:flex;flex-direction:column;gap:var(--sp)}
.dots{display:flex;gap:.5em;align-items:center;font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase}
.dots i{width:calc(var(--u,1px)*22);height:calc(var(--u,1px)*22);min-width:12px;min-height:12px;border-radius:50%;border:2px solid var(--on-fc);transition:background-color .3s,transform .3s var(--e-spring)}
.dots i.on{background:var(--on-fc)}
.dots i.cur{transform:scale(1.3)}
.steptext{font-family:var(--font-d);font-weight:700;font-size:var(--fs-lead);line-height:1.15;margin:0;max-width:20ch;letter-spacing:-.01em}
.resline{font-size:var(--fs-label);font-weight:600;margin:0;max-width:26ch}
.interp{font-size:var(--fs-small);margin:0;max-width:34ch;opacity:.92}
/* predict card */
.predict{display:flex;flex-direction:column;gap:calc(var(--sp)*.5)}
.predict h3{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase;margin:0}
.predict .pq{font-family:var(--font-d);font-weight:700;font-size:calc(var(--fs-lead)*.86);line-height:1.15;margin:0}
.predict .opts{display:flex;flex-direction:column;gap:calc(var(--sp)*.4)}
.predict .st{font-size:var(--fs-small);margin:0}
.optb{display:flex;gap:.7em;align-items:center;text-align:left;width:100%;min-height:max(48px,calc(var(--u,1px)*80));padding:.5em .8em;border-radius:var(--r);border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font-size:var(--fs-label);font-weight:500;line-height:1.25;transition:transform .18s var(--e-out),background-color .2s var(--e-std),box-shadow .2s var(--e-std)}
.optb:hover:not([disabled]){box-shadow:-4px 4px 0 var(--ink)}
.optb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.optb[aria-pressed="true"] .k{background:var(--bg);color:var(--ink)}
.optb .k{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-k);font-weight:900;font-size:.9em}
.optb.ok{background:var(--pos-soft);border-color:var(--positive);color:var(--ink)}
.optb.ok .k{background:var(--positive);color:var(--surface)}
.optb.no{background:var(--neg-soft);border-color:var(--negative);color:var(--ink)}
.optb.no .k{background:var(--negative);color:var(--surface)}
.optb[disabled]{cursor:default}
.reveal{font-size:var(--fs-small);margin:0;padding:.5em .9em;border-radius:var(--r);background:var(--sc);color:var(--ink);display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:baseline;max-width:62ch}
.reveal b{font-family:var(--font-k);letter-spacing:.12em;text-transform:uppercase;font-size:.85em}

/* parties map */
.pmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:calc(var(--gap)*.5);align-items:stretch}
.pn{border-radius:var(--r);padding:var(--sp);display:flex;flex-direction:column;justify-content:center;gap:.2em;background:var(--rc,var(--fc));color:var(--surface);min-height:calc(var(--sp)*6)}
.pn b{font-family:var(--font-d);font-weight:800;font-size:calc(var(--fs-lead)*.72);overflow-wrap:break-word;line-height:1.02;letter-spacing:-.01em}
.pn span{font-size:var(--fs-small);opacity:.92}
.pn.r1{--rc:var(--f1);color:var(--on-f1)}.pn.r2{--rc:var(--f2);color:var(--on-f2)}.pn.r3{--rc:var(--f4);color:var(--on-f4)}
.pls{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sp)*.55)}
.pl{display:flex;flex-direction:column;gap:.15em;font-size:var(--fs-small);font-weight:600;line-height:1.2}
.pl .ar{display:flex;align-items:center;height:calc(var(--u,1px)*26);min-height:14px;color:var(--ink)}
.pl .ar.bk{transform:scaleX(-1)}
.pl .ar svg.ln{flex:1;height:100%;overflow:visible}
.pl .ar svg.hd{flex:none;width:calc(var(--u,1px)*22);min-width:12px;height:100%;overflow:visible}
.pl .av{display:none}
.pl.on{color:var(--tc)}
#app.mode-panel .pmap{grid-template-columns:1fr}
#app.mode-panel .pl{flex-direction:row;align-items:center;gap:.7em}
#app.mode-panel .pl .ar{display:none}
#app.mode-panel .pl .av{display:block;flex:none;width:18px;height:40px}
#app.mode-panel .pl .av.up{transform:scaleY(-1)}
#app.mode-panel .pn{min-height:0}
.draw-s path,.draw-s line{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
.draw.go{animation:drawIn .7s var(--e-out) both;animation-delay:calc(var(--i,0)*120ms + 150ms)}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.hd path{fill:currentColor;stroke:none}
.hd.go{animation:popIn .3s var(--e-spring) both;animation-delay:calc(var(--i,0)*120ms + 700ms)}
/* bars */
.formula{font-family:var(--font-k);font-weight:900;font-stretch:110%;font-size:calc(var(--fs-hero)*.3);line-height:1;letter-spacing:-.02em;margin:0;color:var(--tc)}
.formula small{display:block;font-family:var(--font);font-weight:500;font-stretch:100%;font-size:var(--fs-small);letter-spacing:0;color:var(--ink-muted);margin-top:.5em}
.barsw{display:flex;flex-direction:column;gap:var(--sp);flex:1;min-height:0}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:calc(var(--gap)*.6);align-items:end;height:calc(var(--u,1px)*300);min-height:150px;border-bottom:3px solid var(--ink)}
.barc{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:.25em;height:100%;text-align:center;font-size:var(--fs-small)}
.barc .bar-v{font-family:var(--font-k);font-weight:800;font-size:var(--fs-label)}
.barc .bv{background:var(--fc);border-radius:var(--r) var(--r) 0 0;transform-origin:50% 100%}
.barc.hi .bv{background:var(--tc)}
.barlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:calc(var(--gap)*.6);text-align:center;font-size:var(--fs-small);color:var(--ink-muted);margin-top:-.4em}
.barlab b{display:block;font-family:var(--font-k);color:var(--ink);font-weight:800;letter-spacing:.08em}
.bartot{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap;margin:0;font-size:var(--fs-label)}
.bartot .hero{font-size:calc(var(--fs-hero)*.34)}
.bar-grow{animation:barUp .7s var(--e-out) both;animation-delay:calc(var(--i,0)*90ms + 120ms)}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#app.mode-panel .bars{height:200px}
#app.mode-panel .barc .bar-v{font-size:.68rem;letter-spacing:-.02em}
#app.mode-panel .barlab{font-size:.7rem}
#app.mode-panel .bars,#app.mode-panel .barlab{gap:4px}
.mission .mtag{justify-self:start}
/* timeline */
.tline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:calc(var(--gap)*.4)}
.tp{position:relative;border-radius:var(--r);padding:.6em .3em;text-align:center;font-size:var(--fs-small);background:var(--surface-2);transition:opacity .5s var(--e-std),background-color .4s,color .4s;line-height:1.15}
.tp b{display:block;font-family:var(--font-k);font-weight:900;font-size:var(--fs-lead)}
.tp.ev{background:var(--fc);color:var(--on-fc)}
.tp.lost{opacity:.55}
.tp.lost::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:var(--negative);transform:rotate(-12deg);transform-origin:0 50%}
.tp.lost.nw::after{animation:strike .45s var(--e-out) both}
@keyframes strike{from{transform:rotate(-12deg) scaleX(0)}to{transform:rotate(-12deg) scaleX(1)}}
#app.mode-panel .tline{grid-template-columns:repeat(3,minmax(0,1fr))}
.stmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
#app.mode-panel .stmts{grid-template-columns:1fr}
.stmt{border-top:calc(var(--u,1px)*8) solid var(--fc);padding-top:.5em;display:flex;flex-direction:column;gap:.2em}
#app.mode-panel .stmt{border-top-width:5px}
.stmt b{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.stmt span{font-family:var(--font-d);font-weight:700;font-size:calc(var(--fs-lead)*.95);line-height:1.1}
/* flow */
.flow{display:flex;gap:calc(var(--gap)*.5);align-items:stretch}
.flow .fs{flex:1 1 0;min-width:0;border-radius:var(--r);padding:var(--sp);background:var(--surface-2);display:flex;flex-direction:column;gap:.3em;transition:background-color .4s,color .4s}
.flow .fs .tn{font-family:var(--font-k);font-weight:900;font-stretch:120%;font-size:calc(var(--fs-hero)*.34);line-height:.9;color:var(--tc)}
.flow .fs h4{margin:0;font-family:var(--font-d);font-weight:800;font-size:calc(var(--fs-lead)*1.1);line-height:1.05}
.flow .fs span{font-size:var(--fs-small)}
.flow .fs.now{background:var(--fc);color:var(--on-fc)}
.flow .fs.now .tn{color:var(--on-fc)}
.flow .far{align-self:center;flex:none;width:calc(var(--u,1px)*90);min-width:30px;height:calc(var(--u,1px)*30);min-height:16px;color:var(--ink);display:flex}
.flow .far svg{width:100%;height:100%;overflow:visible}
#app.mode-panel .flow{flex-direction:column}
#app.mode-panel .flow .far{transform:rotate(90deg);align-self:center;width:36px;height:20px}
/* boundary: vs halves */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0;align-items:stretch;flex:1;min-height:0}
.vs .half{border-radius:var(--r);padding:var(--sp) calc(var(--sp)*1.2);display:flex;flex-direction:column;gap:.4em;justify-content:center;min-width:0}
.vs .half.a{background:var(--fc);color:var(--on-fc)}
.vs .half.b{background:var(--surface-2);color:var(--ink);border:3px solid var(--ink)}
.vs .half .hk{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase}
.vs .half .rk{font-size:var(--fs-small);opacity:.9}
.vs .half .hv{font-family:var(--font-d);font-weight:800;font-size:calc(var(--fs-lead)*1.25);line-height:1.05;letter-spacing:-.015em;overflow-wrap:break-word}
.vs .half .hv.n{font-family:var(--font-k);font-weight:900;font-stretch:112%;font-size:calc(var(--fs-hero)*.32);letter-spacing:-.03em}
.vs .vsb{align-self:center;z-index:2;width:calc(var(--u,1px)*96);height:calc(var(--u,1px)*96);min-width:44px;min-height:44px;margin:0 calc(var(--u,1px)*-30);border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-k);font-weight:900;font-size:var(--fs-label)}
#app.mode-panel .vs{grid-template-columns:1fr}
#app.mode-panel .vs .vsb{margin:-14px auto}
.myth{display:flex;gap:.8em;align-items:flex-start;font-size:var(--fs-label);margin:0;max-width:70ch}
.myth .x{flex:none;font-family:var(--font-k);font-weight:900;font-size:var(--fs-kick);letter-spacing:.14em;text-transform:uppercase;background:var(--negative);color:var(--surface);padding:.35em .7em;border-radius:999px;margin-top:.15em}
.myth s{text-decoration-thickness:.12em;text-decoration-color:var(--negative)}
.myth .fx{display:block;font-weight:600;margin-top:.15em}
/* roles slide */
.roles{display:flex;flex-direction:column;gap:calc(var(--sp)*.6)}
.role-c{display:grid;grid-template-columns:auto 1fr;gap:.2em 1em;align-items:center;padding-bottom:calc(var(--sp)*.6);border-bottom:2px solid var(--on-fc)}
.role-c:last-child{border-bottom:0}
.role-c .rn{grid-row:span 2;font-family:var(--font-k);font-weight:900;font-stretch:120%;font-size:calc(var(--fs-hero)*.42);line-height:.85;min-width:1.2ch;text-align:center}
.role-c b{font-family:var(--font-d);font-weight:800;font-size:var(--fs-lead);line-height:1.05}
.tags{display:flex;flex-wrap:wrap;gap:.3em}
.tag{font-size:var(--fs-small);font-weight:600;padding:.12em .6em;border-radius:999px;border:2px solid currentColor;line-height:1.3}
/* drawer */
.drw{position:static;font-size:var(--fs-small);color:var(--ink-muted);z-index:4}
.drw>summary{display:inline-flex;align-items:center;gap:.5em;list-style:none;cursor:pointer;min-height:44px;padding:.2em 1em;border-radius:999px;border:2px solid var(--line);font-family:var(--font-k);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:var(--fs-kick);color:var(--ink);background:var(--surface);position:relative;z-index:6}
.drw>summary::-webkit-details-marker{display:none}
.drw>summary::before{content:"+";font-size:1.4em;line-height:1;transition:transform .25s var(--e-out)}
.drw[open]>summary::before{transform:rotate(45deg)}
.drw>summary:hover{border-color:var(--ink)}
.on-field .drw>summary{border-color:var(--on-fc)}
.drwb{color:var(--ink);font-size:max(15px,var(--fs-small));line-height:1.5;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:var(--sp) calc(var(--sp)*1.1);margin-top:.6em}
#app.mode-stage .drwb{position:absolute;left:calc(var(--pad-x)*.5);right:calc(var(--pad-x)*.5);bottom:calc(var(--pad-y) + 56px);max-height:64%;overflow:auto;z-index:5;box-shadow:0 20px 50px -20px var(--shadow);animation:sheetUp .32s var(--e-out) both}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.drwb h4{margin:.8em 0 .2em;font-family:var(--font-k);font-weight:800;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.drwb h4:first-child{margin-top:0}
.drwb p,.drwb ul,.drwb ol{margin:.2em 0 .5em;max-width:75ch}
.drwb ul,.drwb ol{padding-left:1.3em}
.drwb table{border-collapse:collapse;width:100%;margin:.3em 0 .6em}
.drwb th,.drwb td{border-bottom:1px solid var(--line);padding:.3em .5em;text-align:left;vertical-align:top}
.drwb .src{color:var(--ink-muted)}
.foot{display:flex;flex-wrap:wrap;gap:.5em 1em;align-items:center;margin-top:auto}

/* ======================= motion ======================= */
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes scrInF{from{opacity:0;transform:translateX(var(--dist))}to{opacity:1;transform:none}}
@keyframes scrInB{from{opacity:0;transform:translateX(calc(var(--dist)*-1))}to{opacity:1;transform:none}}
@keyframes lineUp{from{transform:translateY(108%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes blockIn{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes blockUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes digitUp{from{transform:translateY(105%)}to{transform:none}}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateX(-75deg)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes snap{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-22deg)}55%{opacity:1;transform:scale(.9) rotate(-9deg)}75%{transform:scale(1.05) rotate(-9deg)}100%{opacity:1;transform:rotate(-9deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.7)}}
@keyframes chipPop{0%{transform:none}40%{transform:scale(1.25)}100%{transform:none}}
.scr.in.fwd{animation:scrInF .56s var(--e-out) both}
.scr.in.back{animation:scrInB .56s var(--e-out) both}
.scr.in .hl .ln>span{animation:lineUp .7s var(--e-out) both;animation-delay:calc(var(--li,0)*110ms + 90ms)}
.rv{animation:rise .6s var(--e-out) both;animation-delay:calc(var(--i,0)*90ms + 200ms)}
.pop{animation:popIn .5s var(--e-spring) both;animation-delay:calc(var(--i,0)*90ms + 160ms)}
.scr.in .block{animation:blockIn .65s var(--e-out) both}
#app.mode-panel .scr.in .block{animation-name:blockUp}
.flipin{animation:flipIn .5s var(--e-out) both;transform-origin:50% 0}
.shake{animation:shake .42s ease-in-out}
.snap{animation:snap .45s var(--e-spring) both}
.chip-pop{animation:chipPop .45s var(--e-spring)}
.stampin{animation:stamp .75s var(--e-out) both;animation-delay:.25s}

/* reduced motion (OS setting or Ayarlar → Hareketi azalt): fades and count-ups only */
#app.rm .scr.in.fwd,#app.rm .scr.in.back,#app.rm .rv,#app.rm .pop,#app.rm .snap,#app.rm .flipin,#app.rm .stampin,#app.rm .chip-pop,#app.rm .bar-grow,#app.rm .hd.go{animation-name:fadeOnly!important;animation-duration:.27s!important;animation-timing-function:linear!important}
#app.rm .rv,#app.rm .pop,#app.rm .bar-grow,#app.rm .hd.go{animation-delay:calc(var(--i,0)*40ms)!important}
#app.rm .stampin{animation-delay:0s!important}
#app.rm .scr.in .hl .ln>span,#app.rm .scr.in .block,#app.rm .bigno .d>span{animation:none!important}
#app.rm .scr.in .hl{animation:fadeOnly .27s linear both}
#app.rm .shake{animation:none!important}
#app.rm .draw.go{animation-duration:.3s!important;animation-delay:calc(var(--i,0)*40ms)!important}
#app.rm .tp.lost.nw::after{animation:fadeOnly .27s linear both}
#app.rm .drwb{animation:fadeOnly .2s linear both!important}
@keyframes bubRm{0%{opacity:0;transform:none}20%,80%{opacity:1;transform:none}100%{opacity:0;transform:none}}
#app.rm .btn:hover:not([disabled]),#app.rm .optb:hover:not([disabled]){transform:none}
#app.rm .ring{display:none}
#app.rm .topbar i{transition-duration:.3s}

/* ======================= section intro / station / cover ======================= */
.scr.field{background:var(--fc);color:var(--on-fc)}
.lay-field{justify-content:flex-end}
.bigno{position:absolute;right:calc(var(--pad-x)*.6);top:calc(var(--pad-y)*.3);font-family:var(--font-k);font-weight:900;font-stretch:125%;font-size:calc(var(--fs-mega)*1.45);line-height:.8;letter-spacing:-.06em;display:flex;pointer-events:none}
.bigno .d{display:block;overflow:hidden;padding:.04em 0}
.bigno .d>span{display:inline-block}
.scr.in .bigno .d>span{animation:digitUp .8s var(--e-out) both;animation-delay:calc(var(--di,0)*130ms + 120ms)}
#app.rm .scr.in .bigno{animation:fadeOnly .27s linear both}
#app.mode-panel .bigno{position:static;font-size:var(--fs-mega);margin-bottom:-.1em}
.lay-field .hl{max-width:14ch}
.lay-field .lead{max-width:30ch}
.steps3{display:flex;gap:calc(var(--gap)*.6);flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps3 li{display:flex;align-items:baseline;gap:.4em;padding:.45em 1em;border-radius:999px;border:2px solid var(--on-fc);font-family:var(--font-k);font-weight:700;font-size:var(--fs-label)}
.steps3 li b{font-weight:900;font-stretch:115%}
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:var(--gap);flex:1;min-height:0}
#app.mode-panel .cover{grid-template-columns:1fr}
.cover .cl{display:flex;flex-direction:column;gap:var(--sp);justify-content:center}
.seclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--sp)*.35);justify-content:center}
.seclist li{display:flex;align-items:center;gap:.7em;padding:.35em .5em .35em .35em;border-radius:999px;background:var(--fc);color:var(--on-fc);font-weight:600;font-size:var(--fs-label);line-height:1.15}
.seclist li b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;border-radius:50%;background:var(--on-fc);color:var(--fc);font-family:var(--font-k);font-weight:900;font-size:.85em}
.stats{display:flex;gap:calc(var(--gap)*1.4);flex-wrap:wrap;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:.1em}
.stat .hero{font-size:calc(var(--fs-hero)*.62)}
.stat>span:not(.hero){font-family:var(--font-k);font-weight:700;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase}
.check-svg{flex:none;width:calc(var(--u,1px)*200);height:calc(var(--u,1px)*200);min-width:80px;min-height:80px}
.check-svg svg{width:100%;height:100%;display:block}
.check-svg circle,.check-svg path{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}

/* ======================= activities ======================= */
.mission{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.4em 1em;align-items:center;margin:calc(var(--pad-y)*-1) calc(var(--pad-x)*-1) 0;padding:calc(var(--pad-y)*.55) var(--pad-x);background:var(--fc);color:var(--on-fc)}
.mission .mtag{font-family:var(--font-k);font-weight:900;font-stretch:118%;font-size:var(--fs-kick);letter-spacing:.22em;text-transform:uppercase;padding:.45em .9em;border-radius:6px;background:var(--on-fc);color:var(--fc)}
.mission .mh{font-family:var(--font-d);font-weight:800;font-size:var(--fs-head-xs);line-height:1.04;letter-spacing:-.015em;margin:0;max-width:30ch}
.mission .mmeta{display:flex;gap:.5em;flex-wrap:wrap;justify-content:flex-end}
.mission .tk{grid-column:1 / -1;color:var(--on-fc)}
#app.mode-panel .mission{grid-template-columns:1fr;margin:-24px -20px 0;padding:18px 20px}
#app.mode-panel .mission .mmeta{justify-content:flex-start}
.mission .chip{border-color:var(--on-fc)}
.scorechip{display:inline-flex;align-items:center;gap:.4em;font-family:var(--font-k);font-weight:800;font-size:var(--fs-label);padding:.25em .8em;border-radius:999px;background:var(--on-fc);color:var(--fc)}
.scorechip .cuw{font-weight:900}
.act{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:var(--gap);flex:1;min-height:0}
#app.mode-panel .act{display:flex;flex-direction:column}
.act>.main{display:flex;flex-direction:column;gap:var(--sp);min-width:0}
.side{display:flex;flex-direction:column;gap:calc(var(--sp)*.6);font-size:var(--fs-label);min-width:0;background:var(--surface-2);border-radius:var(--r);padding:var(--sp)}
.route{display:flex;gap:.4em;flex-wrap:wrap}
.route span{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.1em;text-transform:uppercase;padding:.4em .8em;border-radius:999px;border:2px solid var(--line);color:var(--ink-muted);transition:background-color .3s,color .3s,border-color .3s}
.route span.on{border-color:var(--ink);color:var(--ink)}
.route span.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wsq{font-family:var(--font-d);font-weight:700;font-size:var(--fs-label);margin:0}
.side .predict h3{color:var(--ink-muted)}
.pool{display:flex;flex-wrap:wrap;gap:calc(var(--sp)*.5)}
.acard{min-height:max(52px,calc(var(--u,1px)*88));text-align:left;font-size:var(--fs-small);font-weight:600;line-height:1.28;padding:.6em .9em;border-radius:var(--r);border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%;box-shadow:0 4px 0 var(--ink);transition:transform .18s var(--e-out),box-shadow .18s var(--e-out),background-color .2s,color .2s}
.acard:hover{box-shadow:0 6px 0 var(--ink)}
.acard[aria-pressed="true"]{background:var(--fc);color:var(--on-fc);border-color:var(--ink);transform:translateY(-6px) rotate(-1.2deg);box-shadow:0 10px 0 var(--ink)}
.acard .why{display:block;font-size:.92em;font-weight:500;margin-top:.3em}
.acard.ok{background:var(--pos-soft);border-color:var(--positive);box-shadow:0 4px 0 var(--positive)}
.acard.no{background:var(--neg-soft);border-color:var(--negative);box-shadow:0 4px 0 var(--negative)}
#app.rm .acard[aria-pressed="true"]{transform:none}
.pool .acard{flex:0 1 auto;max-width:calc(50% - .3em)}
#app.mode-panel .pool .acard{max-width:100%}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap)*.6)}
#app.mode-panel .bins{grid-template-columns:1fr!important}
.bin{border-radius:var(--r);padding:calc(var(--sp)*.5);background:var(--sc);display:flex;flex-direction:column;gap:calc(var(--sp)*.4);min-height:calc(var(--sp)*6)}
.binb{min-height:max(52px,calc(var(--u,1px)*80));font-family:var(--font-k);font-weight:800;font-size:var(--fs-small);letter-spacing:.02em;border-radius:calc(var(--r)*.7);border:3px dashed var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;padding:.4em .6em;transition:background-color .2s,transform .2s var(--e-out)}
.binb:not([disabled]):hover{background:var(--fc);color:var(--on-fc)}
.binb[disabled]{cursor:default;opacity:.85}
.binb .why{font-family:var(--font);font-weight:500}
.why{font-size:.92em;color:inherit;display:block;margin-top:.15em}
.mk{font-weight:800}.mk.ok{color:var(--positive)}.mk.no{color:var(--negative)}.mk.wa{color:var(--warning)}
.fb{border-radius:var(--r);padding:.8em 1em;font-size:var(--fs-label);line-height:1.4;border:3px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--positive);background:var(--pos-soft)}.fb.no{border-color:var(--negative);background:var(--neg-soft)}.fb.un{border-color:var(--warning);background:var(--warn-soft)}.fb.ex{border-color:var(--ink);background:var(--surface)}
.fb .h{font-family:var(--font-k);font-weight:900;font-size:1.05em;display:block;margin-bottom:.25em;letter-spacing:.01em}
.fb .src{display:block;font-size:var(--fs-small);color:var(--ink-muted);margin-top:.35em}
.wsbar{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;border-top:2px solid var(--line);padding-top:calc(var(--sp)*.5);font-size:var(--fs-small)}
.wsbar details summary{cursor:pointer;min-height:44px;display:inline-flex;align-items:center;padding:0 .4em;font-weight:600}
.vin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
#app.mode-panel .vin{grid-template-columns:1fr}
.vctl{border-radius:var(--r);padding:calc(var(--sp)*.7);background:var(--sc);display:flex;flex-direction:column;gap:.4em;font-size:var(--fs-label)}
.vctl label{font-family:var(--font-k);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:var(--fs-kick)}
.vctl .vrow{display:flex;gap:.5em;align-items:center}
.vctl input[type=range]{flex:1;min-width:0;accent-color:var(--ink);height:44px}
.vctl output{font-family:var(--font-k);font-weight:900;font-stretch:112%;font-size:calc(var(--fs-lead)*1.1);min-width:3.6em;text-align:right;display:inline-block}
.vctl .btn{padding:0;width:max(44px,calc(var(--u,1px)*72));height:max(44px,calc(var(--u,1px)*72));font-size:1.2em;font-weight:900}
#app.mode-panel .vctl .vrow{flex-wrap:wrap}#app.mode-panel .vctl output{order:-1;flex:1 0 100%;text-align:left;min-width:0}
.vout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap)*.6)}
#app.mode-panel .vout{grid-template-columns:1fr}
.vbox{border-radius:var(--r);padding:calc(var(--sp)*.7);font-size:var(--fs-small);background:var(--surface-2)}
.vbox b{display:block;font-family:var(--font-k);font-weight:900;font-stretch:108%;font-size:calc(var(--fs-lead)*.95);color:var(--ink);line-height:1.1;margin:.15em 0}
.vbox.ch{background:var(--fc);color:var(--on-fc)}.vbox.ch b{color:var(--on-fc)}
.vbox.df b{color:var(--tc)}
.hbar{height:calc(var(--sp)*1);min-height:12px;border-radius:999px;margin-top:.4em;background:var(--ink);transition:width .5s var(--e-out)}
.hbar.ch{background:var(--on-fc)}
#app.rm .hbar{transition-duration:.25s}
table.dt{border-collapse:collapse;font-size:var(--fs-small);width:100%}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:.25em .5em;text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
.seq{display:flex;flex-direction:column;gap:.35em;margin:0;padding-left:1.6em;font-size:var(--fs-small)}
.seq li.snap{font-weight:700}
.ledger{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
.ledger th,.ledger td{border-bottom:1px solid var(--line);padding:.3em .5em;text-align:left}
.ledger td.n{text-align:right}
.chg{color:var(--tc);font-weight:800}
.tog{display:flex;gap:.6em;align-items:center;min-height:44px;font-size:var(--fs-small);cursor:pointer;font-weight:600}
.tog input{width:24px;height:24px;accent-color:var(--ink)}
/* build workshop map */
.wmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr);gap:calc(var(--gap)*.4);align-items:stretch}
#app.mode-panel .wmap{grid-template-columns:1fr}
.wnode{border-radius:var(--r);padding:calc(var(--sp)*.5);display:flex;flex-direction:column;gap:.4em;background:var(--rs);border:3px solid var(--rc);min-width:0}
.wnode>b{font-family:var(--font-d);font-weight:800;font-size:var(--fs-label);color:var(--ink)}
.wnode.r1{--rc:var(--f1);--rs:var(--s1)}.wnode.r2{--rc:var(--f2);--rs:var(--s2)}.wnode.r3{--rc:var(--f4);--rs:var(--s4)}
.wnode .binb:not([disabled]):hover{background:var(--rc);color:var(--surface)}
.wnode.r2 .binb:not([disabled]):hover{color:var(--on-f2)}
/* game */
.stem{font-family:var(--font-d);font-weight:700;font-size:calc(var(--fs-lead)*.95);margin:0;line-height:1.2;max-width:36ch;letter-spacing:-.01em}
.rolec{font-family:var(--font-k);font-weight:800;font-size:var(--fs-kick);letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
.gopts{display:flex;flex-direction:column;gap:calc(var(--sp)*.45)}
.tin{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.tin input{min-height:max(52px,calc(var(--u,1px)*84));font-family:var(--font-k);font-weight:800;font-size:var(--fs-lead);padding:.15em .6em;border:3px solid var(--ink);border-radius:var(--r);background:var(--surface);min-width:0;width:9em;max-width:100%}
.tin .unit{font-family:var(--font-k);font-weight:700;font-size:var(--fs-label);color:var(--ink-muted)}
.case{border-radius:var(--r);padding:calc(var(--sp)*.8);background:var(--surface-2);display:flex;flex-direction:column;gap:.5em;border:3px solid var(--ink)}
.case h3{margin:0;font-family:var(--font-k);font-weight:900;font-size:var(--fs-kick);letter-spacing:.18em;text-transform:uppercase}
.case ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45em}
.case li{position:relative;font-size:var(--fs-small);border-radius:10px;padding:.45em .6em;border:2px solid var(--line);background:var(--surface);line-height:1.3}
.case li .el{display:block;font-family:var(--font-k);font-weight:800;font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.case li .v{display:block;font-weight:600}
.case li.ok{border-color:var(--positive);background:var(--pos-soft)}.case li.un{border-color:var(--warning);background:var(--warn-soft)}.case li.cor{border-color:var(--ink)}
.case li.now{box-shadow:0 0 0 3px var(--fc)}
.case li.stampin{transform-origin:50% 50%;animation-name:snap;animation-delay:.1s}
.score{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-small);border-top:2px solid var(--line);padding-top:.4em}
.score b{font-family:var(--font-k);font-weight:900;font-size:1.3em}
.gacts{display:flex;gap:.5em;flex-wrap:wrap}
/* uplift seal */
.upl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--gap);flex:1;min-height:0;align-items:center}
#app.mode-panel .upl{grid-template-columns:1fr}
.sealw{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:min(100%,calc(var(--u,1px)*560));width:100%;margin:0 auto}
#app.mode-panel .sealw{max-width:240px}
.seal{position:relative;width:100%;height:100%;border-radius:50%;background:var(--fc);color:var(--on-fc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.1em;transform:rotate(-9deg);box-shadow:0 0 0 calc(var(--u,1px)*12) var(--surface),0 0 0 calc(var(--u,1px)*18) var(--fc)}
.seal svg{width:34%;height:auto}
.seal svg path,.seal svg circle{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.seal b{font-family:var(--font-k);font-weight:900;font-stretch:120%;font-size:calc(var(--fs-kick)*1.15);letter-spacing:.16em;text-transform:uppercase;max-width:9em;line-height:1.15}
.seal.pending{background:var(--surface-2);color:var(--ink-muted);box-shadow:none;border:4px dashed var(--line)}
.ring{position:absolute;inset:0;border-radius:50%;border:calc(var(--u,1px)*10) solid var(--fc);opacity:0;pointer-events:none;animation:ring .9s var(--e-out) .55s both}
.bigscore{display:flex;align-items:baseline;gap:.15em}
.bigscore .hero{font-size:calc(var(--fs-hero)*.9)}
.bigscore .of{font-family:var(--font-k);font-weight:800;font-size:calc(var(--fs-hero)*.3);color:var(--ink-muted)}
.kchips{display:flex;flex-wrap:wrap;gap:.5em}
.kchips span{font-size:var(--fs-small);font-weight:600;padding:.3em .8em;border-radius:999px;background:var(--surface-2)}
.kchips b{font-family:var(--font-k);font-weight:900;margin-right:.3em}
.equal{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);max-width:40em}
.equal .btn{width:100%}
.flag{color:var(--warning);font-weight:700}
.on-field .flag{color:var(--on-fc);text-decoration:underline}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3em 1em;font-size:var(--fs-label);margin:0}
.kv dt{color:var(--ink-muted)}.kv dd{margin:0;font-weight:600}
.statline{font-size:var(--fs-small);color:var(--ink-muted);border-top:1px solid var(--line);padding-top:.5em;margin:0}
.restab{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
.restab th,.restab td{border-bottom:1px solid var(--line);padding:.4em .5em;text-align:left;vertical-align:top}
.restab td.n{text-align:right;white-space:nowrap;font-family:var(--font-k);font-weight:800}
.seals5{display:flex;gap:calc(var(--gap)*.5);flex-wrap:wrap}
.seals5 span{width:calc(var(--u,1px)*110);height:calc(var(--u,1px)*110);min-width:48px;min-height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-k);font-weight:900;font-size:var(--fs-label);border:3px solid var(--fc);color:var(--tc);background:var(--surface)}
.seals5 span.on{background:var(--fc);color:var(--on-fc)}
.phone{width:calc(var(--u,1px)*300);min-width:130px;aspect-ratio:9/16;border-radius:calc(var(--u,1px)*36);border:4px solid var(--ink);overflow:hidden;display:grid;grid-template-rows:repeat(3,1fr);flex:none}
.phone i{display:block}
.phone i:nth-child(1){background:var(--f1)}.phone i:nth-child(2){background:var(--f3)}.phone i:nth-child(3){background:var(--f5)}
.recapc{display:flex;gap:calc(var(--gap)*1.5);align-items:center;flex:1;min-height:0}
#app.mode-panel .recapc{flex-direction:column;align-items:flex-start}

#app.mode-stage .ws,#app.mode-stage .game{--pad-y:calc(var(--u)*44)}
#app.mode-stage .act>.main,#app.mode-stage .act>.side{overflow:auto;min-height:0;overscroll-behavior:contain}
.hero .u{display:block;font-size:.2em;margin:.35em 0 0 .05em;vertical-align:baseline}
#app.mode-panel .hero.l{font-size:calc(var(--fs-hero)*.74)}
#app.mode-panel .hero.xl{font-size:calc(var(--fs-hero)*.5)}
.herow{display:flex;flex-direction:column;gap:.5em}
.scr.lay-stack .vs{margin-top:calc(var(--sp)*.2)}

/* ======================= overlays ======================= */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.ov[hidden]{display:none}
.dlg{background:var(--surface);color:var(--ink);border-radius:20px;border:2px solid var(--ink);max-width:min(860px,100%);width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;animation:dlgIn .32s var(--e-out) both}
@keyframes dlgIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
#app.rm .dlg{animation:fadeOnly .2s linear both}
.dlg header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 12px 20px;border-bottom:2px solid var(--line)}
.dlg header h2{font-family:var(--font-d);font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}
.dlg .body{padding:16px 20px;overflow:auto;font-size:17px}
.dlg.small{max-width:520px}
.dlg .body .scr{height:auto;padding:0;background:transparent;overflow:visible;--fs-mega:4rem;--fs-hero:3.5rem;--fs-head:2.2rem;--fs-head-s:2rem;--fs-head-xs:1.5rem;--fs-lead:1.2rem;--fs-body:1.05rem;--fs-label:1rem;--fs-small:.92rem;--fs-kick:.74rem;--sp:14px;--pad-x:0px;--pad-y:0px;--gap:14px;--r:12px}
.dlg .body .scr.lay-split{display:flex;flex-direction:column}
.dlg .body .lay-split .copy{padding:0}
.dlg .body .block{padding:16px;border-radius:12px}
.dlg .body .wait{display:none}
.dlg .body .stack-top,.dlg .body .tiles,.dlg .body .stmts,.dlg .body .vs,.dlg .body .pmap,.dlg .body .cover,.dlg .body .upl{grid-template-columns:1fr}
.dlg .body .flow{flex-direction:column}.dlg .body .flow .far{transform:rotate(90deg);width:36px;height:20px}
.dlg .body .pl .ar{display:none}.dlg .body .pl .av{display:block;width:18px;height:40px}.dlg .body .pl{flex-direction:row;align-items:center;gap:.6em}.dlg .body .pl .av.up{transform:scaleY(-1)}
.dlg .body .drwb{position:static;max-height:none;animation:none;box-shadow:none}
.dlg .body .bigno{position:static;font-size:4rem}
.dlg .body .vs .vsb{margin:-12px auto}
.setgrp{border:0;margin:0 0 16px;padding:0}
.setgrp legend{font-family:var(--font-k);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin-bottom:8px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--border-control);border-radius:999px;cursor:pointer;font-weight:600}
.radios input{accent-color:var(--ink);width:18px;height:18px}
.warnmsg{color:var(--warning);font-weight:600}
.transcript h3{font-family:var(--font-d);font-size:22px;margin:1.2em 0 .3em}
.transcript h4{font-size:17px;margin:.8em 0 .2em}
.transcript p,.transcript li{max-width:70ch}

/* ======================= map ======================= */
#mapov .dlg{max-width:620px}
.dlg.mapd{max-width:640px;margin-right:auto;margin-left:0;height:calc(100vh - 32px);animation-name:mapIn}
@keyframes mapIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
nav.map>ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
nav.map li.grp{border-radius:16px;padding:12px 12px 12px;background:var(--surface-2)}
nav.map .grph{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
nav.map .grph .gt{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:19px;line-height:1.15}
nav.map .grph .gn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--fc);color:var(--on-fc);font-family:var(--font-k);font-weight:900;font-size:15px}
nav.map .st{font-family:var(--font-k);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);text-align:right}
nav.map .st.rev{color:var(--warning)}
nav.map .st.ok{color:var(--positive)}
nav.map .subs{display:flex;flex-direction:column;gap:6px}
nav.map .subs .rowq{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.map button.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border-radius:12px;border:2px solid transparent;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:15px;line-height:1.25;transition:border-color .15s,transform .15s var(--e-out)}
nav.map button.mi:hover{border-color:var(--ink)}
nav.map button.mi .ty{flex:none;font-family:var(--font-k);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc);min-width:5.6em}
nav.map button.mi .tt{flex:1;min-width:0}
nav.map button.mi .mk{flex:none}
nav.map button.sq{min-width:46px;min-height:46px;border-radius:12px;border:2px solid transparent;background:var(--surface);cursor:pointer;font-family:var(--font-k);font-weight:900;font-size:15px;color:var(--ink);position:relative}
nav.map button.sq:hover{border-color:var(--ink)}
nav.map button.sq.dn{background:var(--fc);color:var(--on-fc)}
nav.map button[aria-current="step"]{border-color:var(--fc);box-shadow:inset 0 0 0 2px var(--fc);font-weight:700}
nav.map .ql{font-family:var(--font-k);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc);min-width:5.6em;padding-left:12px}
#app.rm nav.map button.mi:hover{transform:none}
#app.rm .dlg.mapd{animation:fadeOnly .2s linear both}

/* ======================= recap story (9:16) ======================= */
.story-ov{position:fixed;inset:0;z-index:45;background:var(--story-backdrop);display:flex;align-items:center;justify-content:center}
.story-ov[hidden]{display:none}
.story{--s:.4px;position:relative;width:calc(var(--s)*1080);height:calc(var(--s)*1920);background:var(--fc);color:var(--on-fc);border-radius:calc(var(--s)*44);overflow:hidden;font-family:var(--font);touch-action:pan-y;transition:background-color .5s var(--e-std),color .5s var(--e-std)}
.story :focus-visible{outline:3px solid var(--on-fc);outline-offset:3px}
.story.full{border-radius:0}
.story .segs{position:absolute;left:calc(var(--s)*72);right:calc(var(--s)*72);top:calc(var(--s)*48);height:calc(var(--s)*12);display:flex;gap:calc(var(--s)*12)}
.story .segs i{position:relative;flex:1;border-radius:99px;background:color-mix(in srgb,var(--on-fc) 28%,transparent);overflow:hidden}
.story .segs i::after{content:"";position:absolute;inset:0;background:var(--on-fc);transform-origin:0 50%;transform:scaleX(0);border-radius:99px}
.story .segs i.on::after{transform:none}
.story .segs i.cur::after{animation:segFill .55s var(--e-out) both}
@keyframes segFill{from{transform:scaleX(0)}to{transform:none}}
#app.rm .story .segs i.cur::after{animation:fadeOnly .27s linear both}
.story .close{position:absolute;right:calc(var(--s)*60);top:calc(var(--s)*96);min-width:44px;min-height:44px;height:calc(var(--s)*104);padding:0 calc(var(--s)*40);border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-family:var(--font-k);font-weight:800;font-size:max(15px,calc(var(--s)*36));cursor:pointer;white-space:nowrap}
.story .kick{position:absolute;left:calc(var(--s)*80);top:calc(var(--s)*116);right:calc(var(--s)*320);font-family:var(--font-k);font-weight:800;font-size:calc(var(--s)*34);letter-spacing:.18em;text-transform:uppercase;line-height:1.2;margin:0}
.story .stage9{position:absolute;left:0;right:0;top:calc(var(--s)*250);bottom:calc(var(--s)*250);overflow:hidden}
.story .beat{position:absolute;inset:0 calc(var(--s)*80);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--s)*44)}
.story .beat.old{pointer-events:none}
.story .bno{font-family:var(--font-k);font-weight:900;font-stretch:125%;font-size:calc(var(--s)*200);line-height:.8;letter-spacing:-.05em;opacity:.95}
.story h2{font-family:var(--font-d);font-size:calc(var(--s)*118);line-height:.98;font-weight:800;letter-spacing:-.025em;margin:0}
.story .q{font-size:calc(var(--s)*58);line-height:1.25;margin:0;font-weight:500}
.story .ans{font-family:var(--font-d);font-style:italic;font-size:calc(var(--s)*72);line-height:1.15;margin:0;font-weight:700}
.story .yb{align-self:flex-start;min-height:44px;font-family:var(--font-k);font-size:calc(var(--s)*50);padding:calc(var(--s)*28) calc(var(--s)*56);border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 calc(var(--s)*10) 0 var(--ink)}
.story .yb:active{transform:translateY(calc(var(--s)*6));box-shadow:0 calc(var(--s)*4) 0 var(--ink)}
.story .hero{font-size:calc(var(--s)*230);color:var(--on-fc)}
.story .hero.sm{font-size:calc(var(--s)*150)}
.story .f3{display:flex;flex-direction:column;gap:calc(var(--s)*22);margin:0;padding:0;list-style:none}
.story .f3 li{display:flex;align-items:center;gap:calc(var(--s)*28);font-family:var(--font-d);font-weight:800;font-size:calc(var(--s)*68);line-height:1.1;padding:calc(var(--s)*26) calc(var(--s)*34);border-radius:calc(var(--s)*28);background:var(--surface);color:var(--ink)}
.story .f3 li b{flex:none;font-family:var(--font-k);font-weight:900;font-size:.8em;width:1.6em;height:1.6em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fc);color:var(--on-fc)}
.story .c2{display:flex;flex-direction:column;gap:calc(var(--s)*22)}
.story .c2 div{font-family:var(--font-d);font-weight:800;font-size:calc(var(--s)*68);line-height:1.1;padding:calc(var(--s)*26) calc(var(--s)*34);border-radius:calc(var(--s)*28);background:var(--surface);color:var(--ink)}
.story .c2 div:nth-child(2){background:var(--ink);color:var(--surface)}
.story .c2 small{display:block;font-family:var(--font-k);font-weight:800;font-size:calc(var(--s)*34);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.story .icon svg{width:calc(var(--s)*320);height:calc(var(--s)*320)}
.story .bot{position:absolute;left:calc(var(--s)*80);right:calc(var(--s)*80);bottom:calc(var(--s)*72);height:calc(var(--s)*150);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--s)*24)}
.story .nav{min-width:44px;min-height:44px;width:calc(var(--s)*150);height:calc(var(--s)*150);border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-family:var(--font-k);font-weight:900;font-size:max(22px,calc(var(--s)*64));cursor:pointer;line-height:1;transition:transform .15s var(--e-out)}
.story .nav:active:not([disabled]){transform:scale(.92)}
.story .nav[disabled]{opacity:.35;cursor:not-allowed}
.story .cnt{font-family:var(--font-k);font-weight:900;font-size:max(14px,calc(var(--s)*40));letter-spacing:.12em;text-align:center}
.story .meta{font-family:var(--font-k);font-weight:700;font-size:calc(var(--s)*36);letter-spacing:.12em;text-transform:uppercase;margin:0;opacity:.9}
.story .beat.inF>*{animation:rise .55s var(--e-out) both}
.story .beat.inF>*:nth-child(2){animation-delay:.08s}.story .beat.inF>*:nth-child(3){animation-delay:.16s}.story .beat.inF>*:nth-child(4){animation-delay:.24s}.story .beat.inF>*:nth-child(5){animation-delay:.32s}
.story .beat.inF .hero,.story .beat.inR .hero{animation:popIn .55s var(--e-spring) both}
.story .beat.inR>*{animation:rise .45s var(--e-out) both}
.story .f3 li,.story .c2 div{animation:rise .5s var(--e-out) both;animation-delay:calc(var(--i,0)*110ms + 120ms)}
#app.rm .story .beat.inF>*,#app.rm .story .beat.inR>*,#app.rm .story .f3 li,#app.rm .story .c2 div,#app.rm .story .beat .hero{animation:fadeOnly .27s linear both!important}
.story-ov.reading{align-items:flex-start;overflow:auto;padding:16px 0}
.story-ov.reading .story{--s:.42px;width:min(100%,560px);height:auto;border-radius:16px;padding:24px 20px 24px}
.story-ov.reading .story .segs,.story-ov.reading .story .close,.story-ov.reading .story .kick,.story-ov.reading .story .stage9,.story-ov.reading .story .beat,.story-ov.reading .story .bot{position:static;width:auto;height:auto;inset:auto}
.story-ov.reading .story .segs{margin:0 0 12px;height:8px}
.story-ov.reading .story .close{float:right;padding:0 14px}
.story-ov.reading .story .beat{margin:16px 0}
.story-ov.reading .story .beat.old{display:none}
.story-ov.reading .story h2{font-size:30px}.story-ov.reading .story .q,.story-ov.reading .story .ans,.story-ov.reading .story .f3 li,.story-ov.reading .story .c2 div{font-size:20px}
.story-ov.reading .story .hero{font-size:52px}.story-ov.reading .story .bno{font-size:48px}.story-ov.reading .story .yb{font-size:18px;padding:10px 18px}
.story-ov.reading .story .kick,.story-ov.reading .story .meta,.story-ov.reading .story .cnt{font-size:14px}
.story-ov.reading .story .nav{width:56px;height:56px;font-size:26px}
.story-ov.reading .story .icon svg{width:120px;height:120px}

/* ======================= responsive ======================= */
.resume p{margin:.2em 0 1em}
@media (max-width:760px){
  .top{gap:8px;padding:8px 16px;min-height:56px}
  .brand small,.prog{display:none}
  .brand{flex:1 1 auto}
  .brand b{font-size:19px;overflow:hidden;text-overflow:ellipsis}
  #btnMore{display:inline-flex;align-items:center}

  .tset.open{display:flex;animation:fadeOnly .18s linear}
  .tset .tbtn{text-align:left;border-color:var(--line)}
  .controls{padding:6px 16px 10px;gap:8px}
  #btnNext{min-width:0;flex:1 1 auto;font-size:16px;padding:8px 16px}
  .controls .mid{display:none}
  #btnBack{flex-shrink:0;white-space:nowrap;padding:8px 14px}
  #btnAll{flex-shrink:1;padding:6px 8px;font-size:14px;line-height:1.15}
  .equal{grid-template-columns:1fr}
}
@media print{.top,.dock{display:none}}
/* =====================================================================
   v3 refinement layer: editorial / investor-deck scale, hairlines,
   restrained section colour, eased (non-bouncy) motion
   ===================================================================== */
:root{--e-spring:cubic-bezier(.22,1,.36,1);--hair:1px;--r-s:6px;
  --font-n:"Noto Serif Display","Noto Serif",Georgia,serif}
.sec-0{--on-acc:var(--on-f0)}.sec-1{--on-acc:var(--on-f1)}.sec-2{--on-acc:var(--on-f2)}.sec-3{--on-acc:var(--on-f3)}.sec-4{--on-acc:var(--on-f4)}.sec-5{--on-acc:var(--on-f5)}
body{font-size:17px;line-height:1.55}
/* type scale: roughly 60% of v2 */
#app.mode-stage .stage,#app.mode-stage .scr{
  --fs-mega:calc(var(--u)*190);--fs-hero:calc(var(--u)*138);--fs-head:calc(var(--u)*80);--fs-head-s:calc(var(--u)*64);--fs-head-xs:calc(var(--u)*46);
  --fs-lead:calc(var(--u)*33);--fs-body:calc(var(--u)*27);--fs-label:calc(var(--u)*25);--fs-small:calc(var(--u)*21.5);--fs-kick:calc(var(--u)*17.5);
  --sp:calc(var(--u)*26);--pad-x:calc(var(--u)*128);--pad-y:calc(var(--u)*92);--r:calc(var(--u)*10);--gap:calc(var(--u)*34);--dist:28px}
#app.mode-panel .stage{
  --fs-mega:clamp(3rem,15cqi,5rem);--fs-hero:clamp(2.4rem,11cqi,3.8rem);--fs-head:clamp(1.65rem,7.2cqi,2.45rem);--fs-head-s:clamp(1.45rem,6.2cqi,2.1rem);--fs-head-xs:clamp(1.2rem,4.8cqi,1.6rem);
  --fs-lead:1.125rem;--fs-body:1.0625rem;--fs-label:1rem;--fs-small:.875rem;--fs-kick:.6875rem;
  --sp:14px;--pad-x:20px;--pad-y:26px;--r:8px;--gap:14px;--dist:20px}
.dlg .body .scr{--fs-mega:3rem;--fs-hero:2.6rem;--fs-head:1.8rem;--fs-head-s:1.6rem;--fs-head-xs:1.3rem;--fs-lead:1.1rem;--fs-label:1rem;--fs-small:.9rem;--fs-kick:.7rem}
.stage{border-radius:10px;box-shadow:0 1px 0 var(--line),0 30px 60px -48px var(--shadow);border:var(--hair) solid var(--line)}
.scr{line-height:1.5}
/* headline: light serif, tight tracking */
.hl{font-weight:500;line-height:1.06;letter-spacing:-.018em;max-width:20ch}
.hl.s{max-width:24ch}.hl.xs{max-width:30ch;line-height:1.12}
.lead{font-weight:400;line-height:1.38;max-width:34ch;color:var(--ink)}
.quote{font-weight:400;line-height:1.3;max-width:30ch;border-left-width:2px!important;padding-left:.9em}
#app.mode-stage .quote{border-left-width:calc(var(--u)*3)!important}
/* kicker: small caps label with accent numeral and hairline */
.tk{font-weight:600;letter-spacing:.14em;gap:.4em .9em;color:var(--ink-muted)}
.tk .no{background:none;color:var(--tc);min-width:0;height:auto;padding:0 .9em 0 0;border-radius:0;letter-spacing:.08em;font-weight:700;border-right:var(--hair) solid var(--line)}
.tk .dim{color:var(--ink-muted)}
/* numbers: serif lining figures, not stretched poster digits */
.hero,.gvn,.tile .tn,.formula,.nowcap .stepno,.flow .fs .tn,.role-c .rn,.vs .half .hv.n,.bigscore .of,.tp b,.bigno{font-family:var(--font-n);font-stretch:100%;font-weight:400;letter-spacing:-.02em}
.hero{line-height:.95}
.hero .u{font-family:var(--font-k);font-weight:500;letter-spacing:.02em;font-size:.2em;color:var(--ink-muted)}
.heroc{font-weight:600;letter-spacing:.14em;color:var(--ink-muted)}
.gv{gap:var(--gap) calc(var(--gap)*1.4)}
.gv li{border-top:var(--hair) solid var(--ink)!important;padding-top:.6em}
.gv li:first-child{border-top-color:var(--tc)!important}
.gvn{font-size:calc(var(--fs-hero)*.34)}
.chip{font-weight:600;border-width:1px;letter-spacing:.1em}
.small{line-height:1.45}
/* restrained colour: tinted panels, accent rules; text stays ink */
.on-field{--on-fc:var(--ink)}
.scr.field{background:var(--surface);color:var(--ink)}
.scr.field::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u,1px)*8);min-height:4px;background:var(--fc)}
.bigno{color:var(--tc);font-weight:300;opacity:1;font-size:calc(var(--fs-mega)*1.25)}
#app.mode-panel .bigno{font-size:var(--fs-mega)}
.steps3 li{border:var(--hair) solid var(--line);font-weight:600;border-radius:999px}
.steps3 li b{font-weight:700;font-stretch:100%;color:var(--tc)}
.block{background:var(--sc);color:var(--ink);border-left:var(--hair) solid var(--line)}
.block .tk .no{border-right-color:color-mix(in srgb,var(--ink) 20%,transparent)}
.on-field .route span{opacity:1;border-color:var(--line);color:var(--ink-muted)}
.on-field .route span.on{border-color:var(--ink);color:var(--ink);box-shadow:none}
.on-field .route span.done{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.route span{border-width:1px;font-weight:600}
.tile{background:transparent;border-top:var(--hair) solid var(--ink);border-radius:0;padding:calc(var(--sp)*.8) 0 0;min-height:0;gap:.5em}
.tile .tn{font-size:calc(var(--fs-hero)*.34);color:var(--ink-muted)}
.tile b{font-weight:600;color:var(--ink-muted)}
.tile .tt{font-weight:500;font-size:calc(var(--fs-lead)*1.08)}
.tile.now{background:transparent;color:var(--ink);border-top:calc(var(--u,1px)*4) solid var(--fc)}
#app.mode-panel .tile.now{border-top-width:3px}
.tile.now .tn{color:var(--tc)}
.tiles{gap:calc(var(--gap)*1.2)}
.dots i{border-width:1px;border-color:var(--ink)}.dots i.on{background:var(--ink)}
.dots i.cur{transform:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
.steptext{font-weight:500;line-height:1.25;max-width:26ch}
.nowcap .stepno{font-size:calc(var(--fs-hero)*.36);color:var(--tc)}
.nowcap p{font-weight:400;line-height:1.35;max-width:28ch}
.pn{border-radius:var(--r-s);background:var(--surface);color:var(--ink)!important;border:var(--hair) solid var(--ink);border-top:calc(var(--u,1px)*4) solid var(--rc,var(--fc))}
#app.mode-panel .pn{border-top-width:3px}
.pn b{font-weight:600}
.pn span{color:var(--ink-muted);opacity:1}
.formula{font-size:calc(var(--fs-hero)*.28)}
.bars{border-bottom:var(--hair) solid var(--ink)}
.barc .bv{border-radius:2px 2px 0 0}
.barc .bar-v,.barlab b{font-weight:600}
.tp{border-radius:var(--r-s);background:transparent;border:var(--hair) solid var(--line)}
.tp b{font-size:calc(var(--fs-lead)*.9)}
.tp.ev{background:var(--sc);color:var(--ink);border-color:var(--tc)}
.tp.lost::after{height:1.5px}
.stmt{border-top:var(--hair) solid var(--ink)!important}
.stmt b{font-weight:600}
.stmt span{font-weight:500}
.flow .fs{background:transparent;border:var(--hair) solid var(--line);border-radius:var(--r-s)}
.flow .fs h4{font-weight:500}
.flow .fs .tn{font-size:calc(var(--fs-hero)*.3)}
.flow .fs.now{background:var(--sc);color:var(--ink);border-color:var(--tc)}
.flow .fs.now .tn{color:var(--tc)}
.vs .half{border-radius:var(--r-s)}
.vs .half.a{background:var(--sc);color:var(--ink)}
.vs .half.b{background:var(--surface);border:var(--hair) solid var(--ink)}
.vs .half .hv{font-weight:500}
.vs .vsb{background:var(--surface);color:var(--ink);border:var(--hair) solid var(--ink);font-weight:600;font-family:var(--font-n);font-style:italic}
.myth .x{font-weight:600;background:transparent;color:var(--negative);border:1px solid var(--negative)}
.role-c{border-bottom:var(--hair) solid var(--line)}
.role-c .rn{font-size:calc(var(--fs-hero)*.32);color:var(--tc)}
.role-c b{font-weight:500}
.tag{border-width:1px;font-weight:500}
.seclist{gap:0}
.seclist li{background:transparent;color:var(--ink);border-radius:0;border-bottom:var(--hair) solid var(--line);padding:.55em 0;font-weight:500}
.seclist li:first-child{border-top:var(--hair) solid var(--line)}
.seclist li b{background:transparent;color:var(--tc);width:auto;height:auto;border-radius:0;min-width:2.2em;justify-content:flex-start;font-weight:700;letter-spacing:.06em}
.stat .hero{font-size:calc(var(--fs-hero)*.5)}
.stat>span:not(.hero){font-weight:600}
/* drawer, reveal, feedback */
.drw>summary{border:var(--hair) solid var(--line);font-weight:600;border-radius:999px;min-height:44px}
.drwb{border:var(--hair) solid var(--ink);border-radius:var(--r-s)}
.reveal{border-radius:var(--r-s);background:transparent;border-left:2px solid var(--tc);padding:.3em .9em}
.fb{border-width:1px;border-radius:var(--r-s)}
.fb .h{font-weight:700}
/* buttons and controls: hairline, calm */
.btn{border-width:1px;font-weight:600;letter-spacing:.02em}
.btn:hover:not([disabled]){box-shadow:none;background:var(--surface-2)}
.btn.primary:hover:not([disabled]){background:var(--btn);opacity:.88}
.tbtn{border-width:1px;font-weight:600}

.optb[aria-pressed="true"] .k{border-color:var(--bg)}
.optb.ok .k,.optb.no .k{border:0}
.predict .pq,.wsq,.stem{font-weight:500}
.predict h3{font-weight:600}
/* activities */
.mission{background:var(--surface);color:var(--ink);border-top:calc(var(--u,1px)*8) solid var(--fc);border-bottom:var(--hair) solid var(--line);padding-top:calc(var(--pad-y)*.45);padding-bottom:calc(var(--pad-y)*.4)}
#app.mode-panel .mission{border-top-width:4px}
.mission .mtag{background:transparent;color:var(--tc);border:1px solid var(--tc);font-weight:600;font-stretch:100%;border-radius:999px;letter-spacing:.16em}
.mission .mh{font-weight:500;font-size:calc(var(--fs-head-xs)*.92)}
.mission .tk{color:var(--ink-muted)}
.mission .chip{border-color:var(--line)}
.scorechip{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.side{background:transparent;border:var(--hair) solid var(--line);border-radius:var(--r-s)}
.acard{border-width:1px;border-radius:var(--r-s);box-shadow:0 1px 0 var(--line);font-weight:500}

.bin{background:transparent;border:var(--hair) solid var(--line);border-radius:var(--r-s)}

.wnode{border-width:1px;border-radius:var(--r-s);background:var(--surface);border-top:3px solid var(--rc)}

.vctl{background:transparent;border:var(--hair) solid var(--line);border-radius:var(--r-s)}
.vctl label{font-weight:600}
.vctl output{font-family:var(--font-n);font-weight:400;font-stretch:100%}
.vctl .btn{font-weight:500}
.vbox{background:transparent;border:var(--hair) solid var(--line);border-radius:var(--r-s)}
.vbox b{font-family:var(--font-n);font-weight:400;font-stretch:100%}
.vbox.ch{background:var(--sc);color:var(--ink);border-color:var(--tc)}.vbox.ch b{color:var(--ink)}
.hbar{height:6px;min-height:6px;background:var(--ink-muted)}
.hbar.ch{background:var(--tc)}
.tin input{border-width:1px;border-radius:var(--r-s);font-family:var(--font-n);font-weight:400}
.case{background:transparent;border:var(--hair) solid var(--ink);border-radius:var(--r-s)}
.case h3{font-weight:600}
.case li{border-width:1px;border-radius:var(--r-s)}

.score b{font-family:var(--font-n);font-weight:400}
.wsbar{border-top-width:1px}
/* seal: an engraved ring, not a poster disc */

.seal svg path,.seal svg circle{stroke-width:3}
.ring{border-width:1px}
.bigscore .hero{font-size:calc(var(--fs-hero)*.8)}
.kchips span{background:transparent;border:1px solid var(--line)}
.kchips b{font-weight:600}
.seals5 span{border-width:1px;font-weight:600}
.phone{border-width:1px;border-radius:calc(var(--u,1px)*28)}
/* overlays */
.dlg{border-width:1px;border-radius:10px}
.dlg header{border-bottom-width:1px}
.dlg header h2{font-weight:500}
nav.map li.grp{background:transparent;border:var(--hair) solid var(--line);border-radius:10px}
nav.map .grph .gt{font-weight:500}
nav.map .grph .gn{background:transparent;color:var(--tc);border:1px solid var(--tc);font-weight:600;width:36px;height:36px}

.radios label{border-width:1px}
.top{border-bottom:var(--hair) solid var(--line)}
.brand b{font-weight:600}
.topbar{height:2px}
/* recap story: calmer weights */
.story h2{font-weight:500}.story .ans{font-weight:400}.story .bno{font-family:var(--font-n);font-weight:300;font-stretch:100%}
.story .f3 li,.story .c2 div{font-weight:500}
.story .yb{box-shadow:none;font-weight:600}

/* ---------- chapter progress (replaces the v2 trail) ---------- */
.chap{display:flex;align-items:flex-end;gap:16px;padding:6px 20px 0}
.chap ol{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none;min-width:0}
.chap .cs{display:flex;flex-direction:column;justify-content:flex-end;gap:7px;width:100%;min-height:44px;padding:4px 0 6px;border:0;background:transparent;color:var(--ink-muted);cursor:pointer;text-align:left;font-family:var(--font-k);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden}
.chap .cs .cl{display:flex;gap:.55em;align-items:baseline;overflow:hidden;text-overflow:ellipsis}
.chap .cs .cl b{font-weight:700;color:var(--ink-muted);letter-spacing:.06em}
.chap .cs .cb{position:relative;display:block;height:2px;background:var(--line);overflow:hidden}
.chap .cs .cb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink-muted);transition:width .7s var(--e-std),background-color .4s var(--e-std)}
.chap .cs.past .cb i{background:var(--ink-muted)}
.chap .cs[aria-current="step"]{color:var(--ink)}
.chap .cs[aria-current="step"] .cl b{color:var(--cf)}
.chap .cs[aria-current="step"] .cb i{background:var(--cf)}
.chap .cs:hover{color:var(--ink)}
.chap .cs:focus-visible{outline-offset:2px}
.chap .cnt{flex:none;font-family:var(--font-n);font-size:15px;color:var(--ink-muted);padding-bottom:6px;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em}
.chap .cnt b{color:var(--ink);font-weight:500}
.chap .c1{--cf:var(--t1)}.chap .c2{--cf:var(--t2)}.chap .c3{--cf:var(--t3)}.chap .c4{--cf:var(--t4)}.chap .c5{--cf:var(--t5)}.chap .c6{--cf:var(--ink)}
#app.rm .chap .cs .cb i{transition-duration:.3s;transition-timing-function:linear}
.controls{padding-top:6px}
.dock{border-top:var(--hair) solid var(--line)}

/* ---------- motion: eased, not bouncy ---------- */
@keyframes popIn{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes snap{0%{opacity:.4;transform:scale(.985)}100%{opacity:1;transform:none}}
@keyframes chipPop{0%{background-color:var(--sc)}100%{background-color:transparent}}
@keyframes stamp{0%{opacity:0;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.5;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
@keyframes shake{0%,100%{transform:none}30%{transform:translateX(-3px)}60%{transform:translateX(2px)}}
@keyframes flipIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes blockIn{from{opacity:0;clip-path:inset(0 0 0 12%)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes blockUp{from{opacity:0;clip-path:inset(12% 0 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.scr.in.fwd,.scr.in.back{animation-duration:.5s;animation-timing-function:var(--e-std)}
.rv{animation-duration:.55s;animation-timing-function:var(--e-std);animation-delay:calc(var(--i,0)*80ms + 160ms)}
.pop{animation-duration:.5s;animation-timing-function:var(--e-std)}
.stampin{animation-duration:.7s;animation-timing-function:var(--e-std)}
.draw.go{animation-duration:.8s;animation-timing-function:var(--e-std)}
.hd.go{animation-timing-function:var(--e-std)}

/* ---------- capstone: sukuk design workshop ---------- */

#app.mode-stage .capw>div{overflow:auto;min-height:0;overscroll-behavior:contain;padding-right:4px}
#app.mode-panel .capw{display:flex;flex-direction:column}
.capl{display:flex;flex-direction:column;gap:var(--sp)}
.capr{display:flex;flex-direction:column;gap:var(--sp)}
.csteps{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.csteps button{min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-muted);font-family:var(--font-k);font-weight:600;font-size:var(--fs-kick);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;gap:.5em;align-items:center}

.cgrp{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:.5em;min-width:0}
